name: Activate DB-first global search

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/activate_db_search.py'
      - '.github/workflows/activate-db-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply search UI migration
        run: python3 .github/scripts/activate_db_search.py

      - name: Validate PHP
        run: |
          php -l drive/buscar_archivo.php
          php -l drive/src/Application/FileSearchService.php
          php -l drive/s3.php

      - name: Validate JavaScript
        run: node --check drive/js/archivos.js

      - name: Audit DB-first behavior
        run: |
          set -euo pipefail
          grep -q "FROM FileS3" drive/src/Application/FileSearchService.php
          grep -q "user_id_ = ?" drive/src/Application/FileSearchService.php
          ! grep -q "listObjectsV2" drive/buscar_archivo.php
          ! grep -q "Config::getS3" drive/buscar_archivo.php
          grep -q "data-nombre" drive/js/archivos.js
          grep -q "args.buscar = nombre" drive/js/archivos.js
          grep -q "fact\*" drive/s3.php
          grep -q "\*.pdf" drive/s3.php

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive/js/archivos.js drive/s3.php
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Activate DB-first global file search"
          git push origin main
