name: Activity and cost tracking validation

on:
  push:
    branches:
      - main
      - 'feat/activity-cost-tracking'
    paths:
      - 'drive/activity_costs.php'
      - 'drive/background_tasks.php'
      - 'drive/bloque_carpetas.php'
      - 'drive/create_folder_document.php'
      - 'drive/bin/transcribe_reconcile.php'
      - 'drive/bin/install_transcribe_reconcile_timer.sh'
      - 'drive/bin/polly_reconcile.php'
      - 'drive/bin/install_polly_reconcile_timer.sh'
      - 'drive/bin/move_job_worker.php'
      - 'drive/bin/sync_worker.php'
      - 'drive/config/activity-cost-pricing.json'
      - 'drive/css/activity-costs.css'
      - 'drive/src/Activity/**'
      - 'drive/src/Aws/AwsCostService.php'
      - 'drive/src/Aws/ComprehendFileService.php'
      - 'drive/src/Aws/PollyFileService.php'
      - 'drive/src/Aws/TextractFileService.php'
      - 'drive/src/Aws/TranslateFileService.php'
      - 'drive/src/Application/BackgroundWorkerLauncher.php'
      - 'drive/src/Application/MoveJobService.php'
      - 'drive/src/Application/FolderMutationService.php'
      - 'drive/src/Application/FolderDocumentService.php'
      - 'drive/src/Console/MoveJobWorkerCommand.php'
      - 'drive/src/Console/SyncWorkerCommand.php'
      - 'drive/src/Http/Controller/ActivityCostController.php'
      - 'drive/src/Http/Controller/BackgroundTaskController.php'
      - 'drive/src/Http/Controller/AwsCostController.php'
      - 'drive/src/Http/Controller/AwsFileController.php'
      - 'drive/src/Http/Controller/FileAccessController.php'
      - 'drive/src/Http/Controller/FileMutationController.php'
      - 'drive/src/Http/Controller/FolderMutationController.php'
      - 'drive/src/Http/Controller/FolderDocumentController.php'
      - 'drive/src/Http/Controller/LegacyUploadController.php'
      - 'drive/src/Http/Controller/MoveJobController.php'
      - 'drive/src/Http/Controller/PollyTaskController.php'
      - 'drive/src/Http/Controller/ShareController.php'
      - 'drive/src/Http/Controller/ThumbnailController.php'
      - 'drive/src/Http/Controller/TranscriptionController.php'
      - 'drive/src/Http/Controller/UploadController.php'
      - 'drive/src/Storage/MoveJobStore.php'
      - 'drive/src/Sync/SyncJobStore.php'
      - 'drive/src/View/ActivityCostPageRenderer.php'
      - 'drive/src/View/FolderTreeRenderer.php'
      - 'drive/polly_task_status.php'
      - 'drive/polly_tasks.php'
      - 'drive/js/background-tasks.js'
      - 'drive/js/polly-background.js'
      - 'drive/js/transcribe-background.js'
      - 'drive/js/move-tasks.js'
      - 'drive/js/folder-document.js'
      - 'drive/tests/activity_costs_smoke.php'
      - 'drive/tests/folder_document_sanitizer.php'
      - 'adbbmis1_Cloud.sql'
      - '.github/workflows/activity-costs.yml'
  pull_request:
    paths:
      - 'drive/**'
      - 'adbbmis1_Cloud.sql'
      - '.github/workflows/activity-costs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          for f in \
            drive/activity_costs.php \
            drive/background_tasks.php \
            drive/bloque_carpetas.php \
            drive/create_folder_document.php \
            drive/polly_task_status.php \
            drive/polly_tasks.php \
            drive/bin/transcribe_reconcile.php \
            drive/bin/polly_reconcile.php \
            drive/bin/move_job_worker.php \
            drive/bin/sync_worker.php \
            drive/src/Activity/*.php \
            drive/src/Aws/AwsCostService.php \
            drive/src/Aws/ComprehendFileService.php \
            drive/src/Aws/PollyFileService.php \
            drive/src/Aws/TextractFileService.php \
            drive/src/Aws/TranslateFileService.php \
            drive/src/Application/BackgroundWorkerLauncher.php \
            drive/src/Application/MoveJobService.php \
            drive/src/Application/FolderMutationService.php \
            drive/src/Application/FolderDocumentService.php \
            drive/src/Console/MoveJobWorkerCommand.php \
            drive/src/Console/SyncWorkerCommand.php \
            drive/src/Http/Controller/ActivityCostController.php \
            drive/src/Http/Controller/BackgroundTaskController.php \
            drive/src/Http/Controller/AwsCostController.php \
            drive/src/Http/Controller/AwsFileController.php \
            drive/src/Http/Controller/FileAccessController.php \
            drive/src/Http/Controller/FileMutationController.php \
            drive/src/Http/Controller/FolderMutationController.php \
            drive/src/Http/Controller/FolderDocumentController.php \
            drive/src/Http/Controller/LegacyUploadController.php \
            drive/src/Http/Controller/MoveJobController.php \
            drive/src/Http/Controller/PollyTaskController.php \
            drive/src/Http/Controller/ShareController.php \
            drive/src/Http/Controller/ThumbnailController.php \
            drive/src/Http/Controller/TranscriptionController.php \
            drive/src/Http/Controller/UploadController.php \
            drive/src/Storage/MoveJobStore.php \
            drive/src/Sync/SyncJobStore.php \
            drive/src/View/ActivityCostPageRenderer.php \
            drive/src/View/FolderTreeRenderer.php \
            drive/tests/activity_costs_smoke.php \
            drive/tests/folder_document_sanitizer.php; do
            php -l "$f"
          done

      - name: Validate AWS reconcile shells
        run: |
          bash -n drive/bin/install_transcribe_reconcile_timer.sh
          bash -n drive/bin/install_polly_reconcile_timer.sh

      - name: Validate background task JavaScript
        run: |
          node --check drive/js/background-tasks.js
          node --check drive/js/polly-background.js
          node --check drive/js/transcribe-background.js
          node --check drive/js/move-tasks.js
          node --check drive/js/folder-document.js

      - name: Activity cost smoke test
        run: php drive/tests/activity_costs_smoke.php

      - name: Folder document sanitizer test
        run: php drive/tests/folder_document_sanitizer.php

      - name: Architecture and privacy guards
        run: |
          set -euo pipefail
          grep -q 'ActivityCostController' drive/activity_costs.php
          ! grep -q '\$_GET\|\$_POST\|\$_SESSION' drive/activity_costs.php
          grep -F -q 'e.`user_id_` = ?' drive/src/Activity/ActivityCostRepository.php
          grep -F -q 'LEFT JOIN FileS3 f ON f.id_ = e.`FileId` AND f.user_id_ = e.`user_id_`' drive/src/Activity/ActivityCostRepository.php
          grep -q "state() === 'owner'" drive/src/Http/Controller/ActivityCostController.php
          grep -q "state() !== 'owner'" drive/src/Http/Controller/AwsCostController.php
          grep -q 'COUNT(DISTINCT COALESCE' drive/src/Activity/ActivityCostRepository.php
          grep -F -q 'LIMIT ? OFFSET ?' drive/src/Activity/ActivityCostRepository.php
          grep -q 'recent_pagination' drive/src/Activity/ActivityCostRepository.php drive/src/View/ActivityCostPageRenderer.php
          grep -q 'activity-detail-panel' drive/src/View/ActivityCostPageRenderer.php drive/css/activity-costs.css
          grep -q 'comprehend.nlp_unit' drive/src/Http/Controller/AwsFileController.php
          grep -q 's3_list_requests' drive/src/Application/FolderMutationService.php
          grep -q 'BackgroundWorkerLauncher' drive/src/Http/Controller/MoveJobController.php
          grep -q 'MoveJobWorkerCommand' drive/bin/move_job_worker.php
          grep -q 'folder_move' drive/src/Console/MoveJobWorkerCommand.php
          grep -q 'cost_explorer.api_request' drive/src/Http/Controller/AwsCostController.php
          grep -q 'Best effort' drive/src/Activity/ActivityCostRecorder.php
          grep -q 'Cost Explorer' drive/src/Activity/ActivityCostService.php
          grep -q 'PollyTaskReconciler' drive/bin/polly_reconcile.php
          grep -q 'BackgroundTaskController' drive/background_tasks.php
          grep -q -- '->dispatch()' drive/background_tasks.php
          grep -q 'claimQueued' drive/src/Storage/MoveJobStore.php
          grep -q 'deleteForUser' drive/src/Storage/MoveJobStore.php
          grep -q 'deleteForUser' drive/src/Sync/SyncJobStore.php
          grep -q "button.innerHTML = 'Tareas " drive/js/background-tasks.js
          grep -q 'data-bg-task-action' drive/js/background-tasks.js
          grep -q 'var(--panel-solid' drive/js/background-tasks.js
          ! grep -q 'Tareas AWS' drive/js/background-tasks.js drive/js/polly-background.js drive/js/transcribe-background.js
          grep -q 'FolderDocumentController' drive/create_folder_document.php
          ! grep -q '\$_GET\|\$_POST\|\$_SESSION' drive/create_folder_document.php drive/src/Http/Controller/FolderDocumentController.php
          grep -q 'singleUploadService' drive/src/Http/Controller/FolderDocumentController.php
          grep -F -q 'user_id_ = ? AND Prefix = ? AND Found = 1' drive/src/Application/FolderDocumentService.php
          grep -q 'sanitizeHtmlFragment' drive/src/Application/FolderDocumentService.php
          grep -q 'js-folder-document' drive/src/View/FolderTreeRenderer.php
          grep -q 'folder-document.js' drive/bloque_carpetas.php
          grep -q 'CREATE TABLE IF NOT EXISTS `DriveActivityEvents`' adbbmis1_Cloud.sql
          grep -q 'DROP TABLE IF EXISTS `DriveActivityEvents`' adbbmis1_Cloud.sql
          ! grep -R -E '(AKIA[0-9A-Z]{16}|aws_secret_access_key[[:space:]]*=|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' drive/src/Activity drive/src/Application/FolderDocumentService.php drive/src/Http/Controller/FolderDocumentController.php drive/activity_costs.php drive/config/activity-cost-pricing.json drive/tests

      - name: Diff whitespace check
        run: git diff --check
