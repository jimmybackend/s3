name: Activity retention behavioral regression

on:
  pull_request:
    paths:
      - 'drive/src/Activity/ActivityRetentionService.php'
      - 'drive/src/Console/ActivityRetentionCommand.php'
      - 'drive/bin/activity_retention.php'
      - 'drive/tests/activity_retention_regression.php'
      - '.github/workflows/activity-retention.yml'
  push:
    branches: [main]
    paths:
      - 'drive/src/Activity/ActivityRetentionService.php'
      - 'drive/src/Console/ActivityRetentionCommand.php'
      - 'drive/bin/activity_retention.php'
      - 'drive/tests/activity_retention_regression.php'
      - '.github/workflows/activity-retention.yml'

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP syntax
        run: |
          set -euo pipefail
          php -l drive/src/Activity/ActivityRetentionService.php
          php -l drive/src/Console/ActivityRetentionCommand.php
          php -l drive/bin/activity_retention.php
          php -l drive/tests/activity_retention_regression.php
      - name: Retention and archive behavior
        env:
          ARCADECLOUD_ISOLATED_TEST: '1'
        run: php drive/tests/activity_retention_regression.php
      - name: Diff check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" HEAD
