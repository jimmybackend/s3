name: Add Drive file icons and thumbnails

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_drive_file_icons_thumbnails.py'
      - '.github/workflows/add-drive-file-icons-thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refactor
        run: python3 .github/scripts/add_drive_file_icons_thumbnails.py

      - name: Validate PHP
        run: |
          php -l drive/thumb.php
          php -l drive/generar_galeria.php
          php -l drive/bloque_archivos.php
          php -l drive/src/View/FileIconResolver.php
          php -l drive/src/Media/ThumbnailService.php

      - name: Validate JavaScript
        run: node --check drive/js/imagenes.js

      - name: Audit behavior
        run: |
          set -euo pipefail
          grep -q "FileIconResolver::resolve" drive/bloque_archivos.php
          grep -q "FileViewHelper::formatBytes(\$tamano)" drive/bloque_archivos.php
          grep -q "thumb.php?key=" drive/bloque_archivos.php
          grep -q "audio-player-pro" drive/bloque_archivos.php
          grep -q "js-inline-video-open" drive/bloque_archivos.php
          grep -q "js-lock-file" drive/bloque_archivos.php
          grep -q "js-unlock-file" drive/bloque_archivos.php
          grep -q "FROM FileS3" drive/generar_galeria.php
          ! grep -q "listObjectsV2" drive/generar_galeria.php
          ! grep -q "doesObjectExistV2" drive/thumb.php
          grep -q "S3_THUMB_HIT" drive/src/Media/ThumbnailService.php
          grep -q "GENERATED_ONCE" drive/src/Media/ThumbnailService.php
          grep -q "gu-original-image" drive/js/imagenes.js
          grep -q "file-type-pdf" drive/css/styles-old.css
          php -r 'require "drive/src/View/FileIconResolver.php"; use ArcadeCloud\Drive\View\FileIconResolver; $a=FileIconResolver::resolve("jas"); if($a["category"]!=="text") exit(1); $b=FileIconResolver::resolve("pdf"); if($b["icon"]!=="fa-file-pdf") exit(2); echo "icon resolver ok\n";'

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add file type icons and cached image thumbnails"
          git push origin main
