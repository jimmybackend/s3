name: Apply move task UI

on:
  push:
    branches: ['feature/ui-readable-paths']
    paths:
      - '.github/workflows/apply-move-task-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply_move_task_ui.py

      - name: Validate
        run: |
          set -euo pipefail
          php -l drive/s3.php
          php -l drive/src/Core/DriveApplication.php
          php -l drive/src/Application/FolderQueryService.php
          php -l drive/src/Application/MoveJobService.php
          php -l drive/src/Storage/MoveJobStore.php
          php -l drive/src/Http/Controller/FolderQueryController.php
          php -l drive/src/Http/Controller/MoveJobController.php
          php -l drive/move_task.php
          php -l drive/move_task_status.php
          node --check drive/js/move-tasks.js
          node --check drive/js/archivos.js
          node --check drive/js/carpetas.js
          git diff --check
          grep -q 'destinationsForUser' drive/s3.php
          grep -q 'move-tasks.js' drive/s3.php
          grep -q "type: 'files'" drive/js/archivos.js
          grep -q "type: 'folder'" drive/js/carpetas.js
          echo PHP_OK
          echo JS_OK
          echo MOVE_TASK_OK
          echo DIFF_OK

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            drive/s3.php \
            drive/src/Core/DriveApplication.php \
            drive/js/archivos.js \
            drive/js/carpetas.js
          git commit -m 'Use readable move destinations and background move tasks'
          git push origin HEAD:feature/ui-readable-paths
