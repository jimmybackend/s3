name: Apply readable path UI

on:
  push:
    branches: ['feature/ui-readable-paths']
    paths:
      - '.github/workflows/apply-readable-path-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch UI
        run: python3 .github/scripts/apply_readable_path_ui.py

      - name: Validate
        run: |
          php -l drive/s3.php
          php -l drive/bloque_archivos.php
          php -l drive/src/Storage/FolderRepository.php
          php -l drive/src/Application/FolderQueryService.php
          node --check drive/js/archivos.js
          git diff --check
          ! grep -q 'drive.esforzados.com/aws.php' drive/s3.php
          ! grep -q 'drive.esforzados.com/ec2.php' drive/s3.php
          ! grep -q 'file-s3-location' drive/bloque_archivos.php
          grep -q 'data-ruta-visible' drive/bloque_archivos.php
          grep -q 'displayPathForUser' drive/s3.php
          echo PHP_OK
          echo JS_OK
          echo UI_OK
          echo DIFF_OK

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drive/s3.php drive/bloque_archivos.php drive/js/archivos.js drive/css/styles.css drive/css/responsive.css
          git commit -m 'Improve readable paths and Drive UI details'
          git push origin HEAD:feature/ui-readable-paths
