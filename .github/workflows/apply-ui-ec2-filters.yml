name: Apply UI EC2 filters repair

on:
  push:
    branches: ['feature/ui-readable-paths']
    paths:
      - '.github/workflows/apply-ui-ec2-filters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply_ui_ec2_filters.py

      - name: Validate PHP
        run: |
          set -euo pipefail
          php -l drive/ec2.php
          php -l drive/s3.php
          php -l drive/bloque_archivos.php
          php -l drive/src/Application/FileListService.php
          php -l drive/src/Application/DrivePageService.php
          echo PHP_OK

      - name: Validate JS
        run: |
          set -euo pipefail
          node --check drive/js/carpetas.js
          node --check drive/js/obtenerFiltros.js
          node --check drive/js/filtros.js
          echo JS_OK

      - name: Validate requested behavior
        run: |
          set -euo pipefail
          grep -q 'H::e($val)' drive/ec2.php
          grep -q 'H::e($label)' drive/ec2.php
          ! grep -q 'const PROTECTED_PASSWORD' drive/ec2.php
          grep -q 'password_verify' drive/ec2.php

          for href in \
            'demo.filestash.app/login' \
            'aws.amazon.com/console/' \
            's3.console.aws.amazon.com/s3/buckets' \
            'esforzados.com/AI/index.html' \
            'biblia.esforzados.com/index.php' \
            'tiendas.esforzados.com/' \
            'projects.esforzados.com/' \
            'esforzados.com/drone/'
          do
            ! grep -q "$href" drive/s3.php
          done

          grep -q 'width="48"' drive/s3.php
          grep -q 'height="38"' drive/s3.php
          grep -q 'bulk-filter-toggle d-none d-lg-inline-flex' drive/bloque_archivos.php
          grep -q "query\['limite'\] ?? 10" drive/src/Application/FileListService.php
          grep -q "query\['limite'\] ?? 10" drive/src/Application/DrivePageService.php
          grep -q "_GET\['limite'\] ?? 10" drive/s3.php
          git diff --check
          echo EC2_RENDER_OK
          echo LINKS_OK
          echo FILTERS_OK
          echo LIMIT_10_OK
          echo DIFF_OK

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            drive/ec2.php \
            drive/s3.php \
            drive/bloque_archivos.php \
            drive/css/responsive.css \
            drive/src/Application/FileListService.php \
            drive/src/Application/DrivePageService.php \
            drive/js/carpetas.js \
            drive/js/obtenerFiltros.js \
            drive/js/filtros.js
          git commit -m 'Fix EC2 panel and refine Drive controls'
          git push origin HEAD:feature/ui-readable-paths
