name: Apply user profile modal v2

on:
  push:
    branches:
      - feat/user-profile-modal
    paths:
      - '.github/workflows/apply-user-profile-modal-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply_user_profile_modal.py

      - name: Validate
        run: |
          set -euo pipefail
          php -l drive/s3.php
          php -l drive/profile.php
          php -l drive/src/Core/DriveApplication.php
          php -l drive/src/Security/UserProfileRepository.php
          php -l drive/src/Security/UserProfileValidator.php
          php -l drive/src/Security/UserProfileService.php
          php -l drive/src/Security/PasswordChangeService.php
          php -l drive/src/Aws/SesEmailService.php
          php -l drive/src/Http/Controller/UserProfileController.php
          php -l drive/src/View/UserProfileModalRenderer.php
          php drive/tests/user_profile_validator_smoke.php
          node --check drive/js/profile.js
          git diff --check

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-user-profile-modal.yml
          git rm .github/workflows/apply-user-profile-modal-v2.yml
          git rm .github/scripts/apply_user_profile_modal.py
          git add drive/s3.php drive/src/Core/DriveApplication.php
          git commit -m "feat: integrate user profile modal into Drive"
          git push origin HEAD
