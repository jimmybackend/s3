name: ArcadeCloud AWS MCP (offline tests)

on:
  pull_request:
    paths:
      - "tools/arcadecloud-aws-mcp/**"
      - ".github/workflows/arcadecloud-aws-mcp.yml"
  push:
    branches:
      - "feat/arcadecloud-aws-mcp-bridge-20261008"
    paths:
      - "tools/arcadecloud-aws-mcp/**"
      - ".github/workflows/arcadecloud-aws-mcp.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (no AWS credentials)
        run: python -m pip install -r tools/arcadecloud-aws-mcp/requirements.txt
      - name: Compile Python source
        run: python -m compileall -q tools/arcadecloud-aws-mcp
      - name: Run offline contract tests
        run: python -m unittest discover -s tools/arcadecloud-aws-mcp/tests -v
      - name: Verify MCP SDK and tool wiring
        working-directory: tools/arcadecloud-aws-mcp
        run: python -c "from server import mcp; from mcp.server.mcpserver import MCPServer; assert isinstance(mcp, MCPServer)"
