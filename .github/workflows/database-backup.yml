          mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root < /tmp/arcadecloud-full-dump.sql
          test "$(mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root arcade_dump_test -Nse "SELECT COUNT(*) FROM parent")" -eq 2
          test "$(mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root arcade_dump_test -Nse "SELECT COUNT(*) FROM child")" -eq 2
          test "$(mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root arcade_dump_test -Nse "SELECT COUNT(*) FROM v_nested")" -eq 2
          test "$(mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root arcade_dump_test -Nse "SELECT f_double(9)")" -eq 18
          test "$(mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root arcade_dump_test -Nse "CALL p_echo(7)")" -eq 7
          mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root arcade_dump_test -e "INSERT INTO child(parent_id,note) VALUES(1,NULL)"
          test "$(mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root arcade_dump_test -Nse "SELECT note FROM child ORDER BY id DESC LIMIT 1")" = "from-trigger"
          test "$(mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root -Nse "SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='arcade_dump_test'")" -eq 1
          test "$(mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root -Nse "SELECT COUNT(*) FROM information_schema.ROUTINES WHERE ROUTINE_SCHEMA='arcade_dump_test'")" -eq 2
          test "$(mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root -Nse "SELECT COUNT(*) FROM information_schema.EVENTS WHERE EVENT_SCHEMA='arcade_dump_test'")" -eq 1
          mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root arcade_dump_test -Nse "SHOW CREATE TABLE parent" | grep -q "AUTO_INCREMENT"
          mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root arcade_dump_test -Nse "SHOW CREATE TABLE parent" | grep -q "uq_parent_code"
          mariadb -h127.0.0.1 -P3307 -uroot -parcade-test-root arcade_dump_test -Nse "SHOW CREATE TABLE child" | grep -q "fk_child_parent"
          grep -q -- "-- Status: COMPLETE" /tmp/arcadecloud-full-dump.sql
      - name: Diff check
        run: git diff --check
