name: FederationCloud HTTPS endpoint validation

on:
  pull_request:
    branches: ['main']
    paths:
      - 'drive/src/Federation/FederationEndpointResolver.php'
      - 'drive/bin/federation_https_reconcile.php'
      - 'drive/bin/federation_endpoint_refresh.php'
      - 'drive/bin/install_federation_https_service.sh'
      - 'drive/tests/federation_endpoint_resolver_smoke.php'
      - 'drive/tests/federation_https_contract_smoke.php'
      - 'drive/docs/FEDERATION_HTTPS_ENDPOINT.md'
      - '.github/workflows/federation-https-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP syntax
        run: |
          set -euo pipefail
          php -l drive/src/Federation/FederationEndpointResolver.php
          php -l drive/bin/federation_https_reconcile.php
          php -l drive/bin/federation_endpoint_refresh.php
          php -l drive/tests/federation_endpoint_resolver_smoke.php
          php -l drive/tests/federation_https_contract_smoke.php

      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n drive/bin/install_federation_https_service.sh

      - name: Endpoint resolver regression
        run: |
          set -euo pipefail
          php drive/tests/federation_endpoint_resolver_smoke.php

      - name: HTTPS automation contract
        run: |
          set -euo pipefail
          php drive/tests/federation_https_contract_smoke.php

      - name: Security guards
        run: |
          set -euo pipefail
          ! grep -R -E '(AKIA[0-9A-Z]{16}|aws_secret_access_key[[:space:]]*=|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' \
            drive/src/Federation/FederationEndpointResolver.php \
            drive/bin/federation_https_reconcile.php \
            drive/bin/federation_endpoint_refresh.php \
            drive/bin/install_federation_https_service.sh \
            drive/tests/federation_endpoint_resolver_smoke.php \
            drive/tests/federation_https_contract_smoke.php \
            drive/docs/FEDERATION_HTTPS_ENDPOINT.md
          ! grep -q 'shell_exec(' drive/bin/federation_https_reconcile.php
          grep -q '169.254.169.254/latest/api/token' drive/bin/federation_https_reconcile.php
          grep -q -- '--preferred-profile' drive/bin/federation_https_reconcile.php
          grep -q 'shortlived' drive/bin/federation_https_reconcile.php
          grep -q -- '--ip-address' drive/bin/federation_https_reconcile.php
          grep -q '127.0.0.1:80' drive/bin/federation_https_reconcile.php

      - name: Diff whitespace check
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
