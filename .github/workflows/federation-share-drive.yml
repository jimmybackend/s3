name: FederationCloud Shares to Drive validation

on:
  pull_request:
    paths:
      - 'adbbmis1_Cloud.sql'
      - 'drive/src/Federation/FederationShareDrive*.php'
      - 'drive/src/Federation/FederationShareDownloader.php'
      - 'drive/src/Federation/FederationPublicImport*.php'
      - 'drive/src/Federation/FederationMultiSourceDownloader.php'
      - 'drive/src/Federation/FederationReplicaResolverService.php'
      - 'drive/src/Http/Controller/FederationShareDriveController.php'
      - 'drive/src/Http/Controller/FederationPublicImportController.php'
      - 'drive/federationcloud/share-drive.php'
      - 'drive/federationcloud/public-drive.php'
      - 'drive/bin/federation_sync.php'
      - 'drive/src/Federation/FederationSyncCycleService.php'
      - 'drive/js/federation-share-drive.js'
      - 'drive/js/federation-portal.js'
      - 'drive/src/View/FederationPortalRenderer.php'
      - 'drive/bloque_carpetas.php'
      - 'drive/docs/FEDERATION_ACCESS_AND_SHARES.md'
      - '.github/workflows/federation-share-drive.yml'
  push:
    branches: [main]
    paths:
      - 'adbbmis1_Cloud.sql'
      - 'drive/src/Federation/FederationShareDrive*.php'
      - 'drive/src/Federation/FederationShareDownloader.php'
      - 'drive/src/Federation/FederationPublicImport*.php'
      - 'drive/src/Federation/FederationMultiSourceDownloader.php'
      - 'drive/src/Federation/FederationReplicaResolverService.php'
      - 'drive/src/Http/Controller/FederationShareDriveController.php'
      - 'drive/src/Http/Controller/FederationPublicImportController.php'
      - 'drive/federationcloud/share-drive.php'
      - 'drive/federationcloud/public-drive.php'
      - 'drive/bin/federation_sync.php'
      - 'drive/src/Federation/FederationSyncCycleService.php'
      - 'drive/js/federation-share-drive.js'
      - 'drive/js/federation-portal.js'
      - 'drive/src/View/FederationPortalRenderer.php'
      - 'drive/bloque_carpetas.php'
      - 'drive/docs/FEDERATION_ACCESS_AND_SHARES.md'
      - '.github/workflows/federation-share-drive.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: arcade-test-root
          MARIADB_DATABASE: arcade_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -parcade-test-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      mysql57:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: arcade-test-root
          MYSQL_DATABASE: arcade_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -parcade-test-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      mysql8:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: arcade-test-root
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -parcade-test-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          php -l drive/src/Federation/FederationShareDriveRepository.php
          php -l drive/src/Federation/FederationShareDownloader.php
          php -l drive/src/Federation/FederationShareDriveService.php
          php -l drive/src/Federation/FederationPublicImportRepository.php
          php -l drive/src/Federation/FederationPublicImportService.php
          php -l drive/src/Federation/FederationMultiSourceDownloader.php
          php -l drive/src/Federation/FederationReplicaResolverService.php
          php -l drive/src/Http/Controller/FederationShareDriveController.php
          php -l drive/src/Http/Controller/FederationPublicImportController.php
          php -l drive/federationcloud/share-drive.php
          php -l drive/federationcloud/public-drive.php
          php -l drive/bin/federation_sync.php
          php -l drive/src/Federation/FederationSyncCycleService.php
          php -l drive/src/View/FederationPortalRenderer.php
          php -l drive/bloque_carpetas.php

      - name: Validate JavaScript
        run: |
          node --check drive/js/federation-share-drive.js
          node --check drive/js/federation-portal.js

      - name: Validate idempotent MariaDB and MySQL schemas
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client

          sed -n '/^-- ARCADECLOUD:FEDERATION_SCHEMA:BEGIN$/,/^-- ARCADECLOUD:FEDERATION_SCHEMA:END$/p' adbbmis1_Cloud.sql > /tmp/arcadecloud-federation-schema.sql
          grep -q 'FederationEvents' /tmp/arcadecloud-federation-schema.sql
          grep -q 'FederationShares' /tmp/arcadecloud-federation-schema.sql

          for port in 3306 3307; do
            mysql -h127.0.0.1 -P"$port" -uroot -parcade-test-root arcade_test < /tmp/arcadecloud-federation-schema.sql
            mysql -h127.0.0.1 -P"$port" -uroot -parcade-test-root arcade_test < /tmp/arcadecloud-federation-schema.sql
            mysql -h127.0.0.1 -P"$port" -uroot -parcade-test-root arcade_test -Nse "SHOW TABLES LIKE 'FederationShareImportJobs'" | grep -q FederationShareImportJobs
            mysql -h127.0.0.1 -P"$port" -uroot -parcade-test-root arcade_test -Nse "SHOW TABLES LIKE 'FederationPublicImportJobs'" | grep -q FederationPublicImportJobs
            mysql -h127.0.0.1 -P"$port" -uroot -parcade-test-root arcade_test -Nse "SHOW TABLES LIKE 'FederationDropIngressObjects'" | grep -q FederationDropIngressObjects
            mysql -h127.0.0.1 -P"$port" -uroot -parcade-test-root arcade_test -Nse "SHOW TABLES LIKE 'FederationDropAccounts'" | grep -q FederationDropAccounts
            mysql -h127.0.0.1 -P"$port" -uroot -parcade-test-root arcade_test -Nse "SHOW TABLES LIKE 'FederationDropIdentities'" | grep -q FederationDropIdentities
            mysql -h127.0.0.1 -P"$port" -uroot -parcade-test-root arcade_test -Nse "SHOW COLUMNS FROM FederationShares LIKE 'LocalFileId'" | grep -q LocalFileId
            mysql -h127.0.0.1 -P"$port" -uroot -parcade-test-root arcade_test -Nse "SHOW COLUMNS FROM FederationShares LIKE 'ImportedContentId'" | grep -q ImportedContentId
          done

      - name: Validate full clean and repeatable canonical schema on MySQL 8
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root -e "CREATE DATABASE arcade_clean_a CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root arcade_clean_a < adbbmis1_Cloud.sql
          mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root arcade_clean_a < adbbmis1_Cloud.sql

          test "$(mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root -Nse "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='arcade_clean_a'")" -eq 73
          mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root arcade_clean_a -Nse "SHOW TABLES LIKE 'S3SyncSeen'" | grep -q S3SyncSeen
          mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root arcade_clean_a -Nse "SHOW TABLES LIKE 'MediaProcessingJobs'" | grep -q MediaProcessingJobs
          mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root arcade_clean_a -Nse "SHOW TABLES LIKE 'MediaWorkerNodeSessions'" | grep -q MediaWorkerNodeSessions
          mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root arcade_clean_a -Nse "SHOW INDEX FROM FileS3 WHERE Key_name='uq_files3_user_path_key'" | grep -q uq_files3_user_path_key
          ! mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root arcade_clean_a -Nse "SHOW INDEX FROM FileS3 WHERE Key_name='uq_files3_user_key'" | grep -q uq_files3_user_key
          test "$(mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root arcade_clean_a -Nse "SELECT COUNT(*) FROM UserPipelineFeatures")" -eq 0
          test "$(mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root arcade_clean_a -Nse "SELECT COUNT(*) FROM UserPreferences")" -eq 0
          test "$(mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root arcade_clean_a -Nse "SELECT COUNT(*) FROM UserAIAgentConfigs WHERE scope='user'")" -eq 0

          mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root -e "CREATE DATABASE arcade_clean_b CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root arcade_clean_b < adbbmis1_Cloud.sql
          test "$(mysql -h127.0.0.1 -P3308 -uroot -parcade-test-root -Nse "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='arcade_clean_b'")" -eq 73

      - name: Shares schema guards
        run: |
          set -euo pipefail
          grep -q 'LocalFileId' adbbmis1_Cloud.sql
          grep -q 'LocalS3Key' adbbmis1_Cloud.sql
          grep -q 'ImportedAt' adbbmis1_Cloud.sql
          grep -q 'ImportedResourceUpdatedAt' adbbmis1_Cloud.sql
          grep -q 'ImportedContentId' adbbmis1_Cloud.sql
          grep -q 'FederationShareImportJobs' adbbmis1_Cloud.sql
          grep -q 'uq_fshare_import_version' adbbmis1_Cloud.sql
          grep -q 'FederationPublicImportJobs' adbbmis1_Cloud.sql
          grep -q 'FederationDropIngressObjects' adbbmis1_Cloud.sql
          grep -q 'FederationDropAccounts' adbbmis1_Cloud.sql
          grep -q 'FederationDropIdentities' adbbmis1_Cloud.sql
          grep -q 'OwnerAccountId' adbbmis1_Cloud.sql
          grep -q 'uq_fpublic_import_version' adbbmis1_Cloud.sql
          grep -q 'information_schema.COLUMNS' adbbmis1_Cloud.sql
          ! grep -q 'ADD COLUMN IF NOT EXISTS' adbbmis1_Cloud.sql
          ! grep -q 'ADD INDEX IF NOT EXISTS' adbbmis1_Cloud.sql

      - name: DB-first and background storage guards
        run: |
          set -euo pipefail
          grep -q 'singleUploadService()->upload' drive/src/Federation/FederationShareDriveService.php
          grep -q 'userStoragePath()->rootForUser' drive/src/Federation/FederationShareDriveService.php
          grep -q 'FileS3' drive/src/Federation/FederationShareDriveRepository.php
          grep -q 'queueImport' drive/src/Http/Controller/FederationShareDriveController.php
          grep -q 'FederationShareDriveService' drive/src/Federation/FederationSyncCycleService.php
          grep -q 'FederationPublicImportService' drive/src/Federation/FederationSyncCycleService.php
          grep -q 'syncPending(1)' drive/src/Federation/FederationSyncCycleService.php
          grep -q 'singleUploadService()->upload' drive/src/Federation/FederationPublicImportService.php
          grep -q 'FederationMultiSourceDownloader' drive/src/Federation/FederationPublicImportService.php
          ! grep -R 'listObjects\|ListObjects' drive/src/Federation/FederationShareDrive*.php drive/src/Federation/FederationShareDownloader.php

      - name: Download security guards
        run: |
          set -euo pipefail
          grep -q 'download=1' drive/src/Federation/FederationShareDownloader.php
          grep -q 'CURLPROTO_HTTPS' drive/src/Federation/FederationShareDownloader.php
          grep -q 'FILTER_FLAG_NO_PRIV_RANGE' drive/src/Federation/FederationShareDownloader.php
          grep -q 'amazonaws\\.com' drive/src/Federation/FederationShareDownloader.php
          grep -q 'CURLOPT_FOLLOWLOCATION => false' drive/src/Federation/FederationShareDownloader.php
          grep -q 'MAX_DOWNLOAD_SECONDS' drive/src/Federation/FederationShareDownloader.php

      - name: UX guards
        run: |
          set -euo pipefail
          grep -q 'Compartidos' drive/bloque_carpetas.php
          grep -q 'Agregar a Mi Drive' drive/js/federation-share-drive.js
          grep -q 'Agregar versión nueva' drive/js/federation-share-drive.js
          grep -q 'Copia en cola' drive/js/federation-share-drive.js
          grep -q 'share-drive.php' drive/js/federation-share-drive.js
          grep -q 'Agregar a Mi Drive' drive/js/federation-portal.js
          grep -q 'public-drive.php' drive/js/federation-portal.js

      - name: Diff whitespace check
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD || git diff --check HEAD^
