name: FederationCloud validation

on:
  push:
    branches:
      - main
      - 'feature/arcadelink-v1-federationcloud'
      - 'feature/federation-node-directory'
      - 'feature/federation-node-name-recovery'
      - 'feature/federation-provider-approvals'
    paths:
      - 'drive/federationcloud/**'
      - 'drive/bin/federation_*.php'
      - 'drive/config/federation-seeds.json'
      - 'drive/src/Federation/**'
      - 'drive/src/Http/Controller/FederationController.php'
      - 'drive/src/Http/Controller/FederationDirectoryController.php'
      - 'drive/src/Http/Controller/FederationProviderController.php'
      - 'drive/src/View/FederationPageRenderer.php'
      - 'drive/tests/federationcloud_smoke.php'
      - 'drive/tests/federation_directory_smoke.php'
      - 'drive/tests/federation_provider_smoke.php'
      - 'drive/docs/FEDERATIONCLOUD.md'
      - 'adbbmis1_Cloud.sql'
      - 'drive/bloque_footer.php'
      - 'drive/js/federation-footer.js'
      - '.github/workflows/federationcloud.yml'
  pull_request:
    paths:
      - 'drive/federationcloud/**'
      - 'drive/bin/federation_*.php'
      - 'drive/config/federation-seeds.json'
      - 'drive/src/Federation/**'
      - 'drive/src/Http/Controller/FederationController.php'
      - 'drive/src/Http/Controller/FederationDirectoryController.php'
      - 'drive/src/Http/Controller/FederationProviderController.php'
      - 'drive/src/View/FederationPageRenderer.php'
      - 'drive/tests/federationcloud_smoke.php'
      - 'drive/tests/federation_directory_smoke.php'
      - 'drive/tests/federation_provider_smoke.php'
      - 'drive/docs/FEDERATIONCLOUD.md'
      - 'adbbmis1_Cloud.sql'
      - 'drive/bloque_footer.php'
      - 'drive/js/federation-footer.js'
      - '.github/workflows/federationcloud.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP runtime requirements
        run: |
          php -r 'if (!extension_loaded("sodium")) { fwrite(STDERR, "sodium missing\n"); exit(1); }'

      - name: Validate FederationCloud PHP syntax
        run: |
          set -euo pipefail
          find drive/src/Federation drive/federationcloud -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find drive/bin -maxdepth 1 -type f -name 'federation_*.php' -print0 | xargs -0 -n1 php -l
          php -l drive/src/Http/Controller/FederationController.php
          php -l drive/src/Http/Controller/FederationDirectoryController.php
          php -l drive/src/Http/Controller/FederationProviderController.php
          php -l drive/src/View/FederationPageRenderer.php
          php -l drive/bloque_footer.php
          php -l drive/tests/federationcloud_smoke.php
          php -l drive/tests/federation_directory_smoke.php
          php -l drive/tests/federation_provider_smoke.php

      - name: FederationCloud cryptographic smoke test
        run: php drive/tests/federationcloud_smoke.php

      - name: FederationCloud directory and recovery smoke test
        run: php drive/tests/federation_directory_smoke.php

      - name: FederationCloud provider authorization smoke test
        run: php drive/tests/federation_provider_smoke.php

      - name: Security and architecture guards
        run: |
          set -euo pipefail
          grep -q "XChaCha20-Poly1305" drive/src/Federation/ArcadeLinkService.php
          grep -q "Ed25519" drive/src/Federation/ArcadeLinkService.php
          grep -q "Argon2id13" drive/src/Federation/NodeIdentityBackupService.php
          grep -q "FILTER_FLAG_NO_PRIV_RANGE" drive/src/Federation/FederationHttpClient.php
          grep -q "CURLOPT_FOLLOWLOCATION => false" drive/src/Federation/FederationHttpClient.php
          grep -q "CURLOPT_RESOLVE" drive/src/Federation/FederationHttpClient.php
          grep -q "provider-request.php" drive/src/Federation/FederationHttpClient.php
          grep -q "https://drive.esforzados.com/federationcloud/" drive/config/federation-seeds.json
          grep -q 'CREATE TABLE IF NOT EXISTS `FederationNodes`' adbbmis1_Cloud.sql
          grep -q 'CREATE TABLE IF NOT EXISTS `FederationNodeAuthorizations`' adbbmis1_Cloud.sql
          grep -q '`NodeName` varchar(64) CHARACTER SET ascii COLLATE ascii_general_ci DEFAULT NULL' adbbmis1_Cloud.sql
          grep -q 'UNIQUE KEY `uq_federation_nodes_name` (`NodeName`)' adbbmis1_Cloud.sql
          grep -q "Sólo Administración puede autorizar nodos proveedores" drive/src/Http/Controller/FederationProviderController.php
          grep -q "X-Federation-CSRF" drive/js/federation-footer.js
          ! grep -R "drive.esforzados.com" drive/src/Federation
          ! grep -R -E '(AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|aws_secret_access_key[[:space:]]*=)' drive/src/Federation drive/federationcloud drive/bin/federation_*.php drive/tests/federationcloud_smoke.php drive/tests/federation_directory_smoke.php drive/tests/federation_provider_smoke.php
          ! grep -R "s3.amazonaws.com" drive/src/Federation drive/federationcloud

      - name: Diff whitespace check
        run: git diff --check
