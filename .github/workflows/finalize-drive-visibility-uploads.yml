name: Finalize Drive visibility and uploads

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/finalize_drive_visibility_uploads.py'
      - '.github/workflows/finalize-drive-visibility-uploads.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refactor
        run: python3 .github/scripts/finalize_drive_visibility_uploads.py

      - name: Validate PHP
        run: |
          set -euo pipefail
          find drive -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l Config-s3.php
          php -l db.php

      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check drive/js/subir.js
          node --check drive/js/subir-dropzone.js
          node --check drive/js/subir-chunked.js
          node --check drive/js/upload-destination.js
          node --check drive/js/ver-metadatos.js
          node --check drive/js/soportesMediaTypes.js

      - name: Audit visibility and uploads
        run: |
          set -euo pipefail

          # Peso por archivo y carpeta debe seguir usando la clase helper.
          grep -Fq 'FileViewHelper::formatBytes($tamano)' drive/bloque_archivos.php
          grep -Fq 'FileViewHelper::formatBytes($carpetaBytes)' drive/bloque_archivos.php
          php -r "require 'drive/src/View/FileViewHelper.php'; use ArcadeCloud\\Drive\\View\\FileViewHelper; if (FileViewHelper::formatBytes(1536) !== '1.50 KB') exit(1); if (FileViewHelper::formatBytes(1610612736) !== '1.50 GB') exit(2); echo \"peso-ok\\n\";"

          # Preferencias de metadatos/media/conteos/filtros ya no deben condicionar la vista.
          ! grep -R -nE 'showMetas|mediaHidden|showCounts|showFilters|toggle_metas|toggle_media|toggle_counts|toggle_filters|modalPreferencias|preferencesRedirect' drive/s3.php drive/src/Application/DrivePageService.php drive/src/Application/DrivePageViewModel.php
          grep -Fq 'js-file-metadata' drive/bloque_archivos.php
          grep -Fq 'audio-player-pro' drive/bloque_archivos.php
          grep -Fq 'js-inline-video-open' drive/bloque_archivos.php

          # Las cuatro modalidades autenticadas siguen presentes.
          grep -Fq "case 'local_put'" drive/upload/UploadFactory.php
          grep -Fq "case 'remote_url'" drive/upload/UploadFactory.php
          grep -Fq "case 'dropbox'" drive/upload/UploadFactory.php
          grep -Fq "case 'chunked'" drive/upload/UploadFactory.php
          grep -Fq 'ruta_objetivo' drive/js/subir.js
          grep -Fq 'ruta_objetivo' drive/js/subir-dropzone.js
          grep -Fq 'ruta_objetivo' drive/js/subir-chunked.js
          grep -Fq "completeJson.ok !== true" drive/js/subir.js
          grep -Fq 'Estado multipart inválido' drive/upload/drivers/Chunked15MBUploader.php

          # up.php continúa siendo público (sin requireAuthenticated) y su backend ya es OOP.
          grep -Fq 'PublicMultipartUploadService' drive/up.php
          grep -Fq 'final class PublicMultipartUploadService' drive/src/Upload/PublicMultipartUploadService.php
          ! grep -Fq 'requireAuthenticated' drive/up.php
          ! grep -Fq 'function handle_init' drive/up.php
          ! grep -Fq "application/x-directory" drive/up.php drive/src/Upload/PublicMultipartUploadService.php

          # Ninguno de los uploaders autenticados decide el destino leyendo la ruta mutable de sesión.
          ! grep -R -nF "\$_SESSION['ruta_actual']" drive/upload/drivers

      - name: Commit final refactor
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/finalize_drive_visibility_uploads.py
          git rm .github/workflows/finalize-drive-visibility-uploads.yml
          git add drive
          git commit -m 'Keep Drive metadata visible and harden upload flows'
          git push origin HEAD:main
