name: Finalize OOP runtime

on:
  push:
    branches: ['refactor/oop-drive-migration']
    paths:
      - '.github/scripts/finalize_oop_runtime.py'
      - '.github/workflows/finalize-oop-runtime.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final runtime refactor
        run: python3 .github/scripts/finalize_oop_runtime.py

      - name: Validate PHP
        run: |
          set -euo pipefail
          php -l drive/s3.php >/dev/null
          php -l drive/up.php >/dev/null
          php -l drive/ec2.php >/dev/null
          php -l drive/ec2-cron.php >/dev/null
          php -l drive/src/Aws/Ec2Gateway.php >/dev/null
          php -l drive/src/Aws/RdsGateway.php >/dev/null
          php -l drive/src/Aws/Ec2CronLogger.php >/dev/null
          php -l drive/src/Aws/Ec2CostGuardService.php >/dev/null
          php -l drive/src/Security/UserDirectoryRepository.php >/dev/null
          php -l drive/src/Upload/AdminMultipartUploadService.php >/dev/null
          php -l drive/src/Upload/UploadCatalogRepository.php >/dev/null
          php -l drive/src/Core/DriveApplication.php >/dev/null
          echo PHP_OK

      - name: Validate architecture boundaries
        run: |
          set -euo pipefail
          ! grep -q 's3Manager()->listarCarpetasDesdeDb' drive/s3.php
          ! grep -Eq '\$db->|->prepare\(|->query\(' drive/up.php
          ! grep -Eq 'new[[:space:]]+(Ec2Client|RdsClient)|class[[:space:]]+(EC2Panel|RDSPanel)' drive/ec2.php
          ! grep -Eq 'function[[:space:]]+(logLine|stateName|isRunningLike|secondaryMustBeOffNow|shouldForceNow|listAllInstances)' drive/ec2-cron.php
          grep -q 'adminMultipartUploadService' drive/up.php
          grep -q 'folderQueryService' drive/s3.php
          grep -q 'Ec2CostGuardService' drive/ec2-cron.php
          echo OOP_OK

      - name: Validate diff
        run: |
          set -euo pipefail
          git diff --check
          echo DIFF_OK

      - name: Commit refactor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            drive/s3.php \
            drive/up.php \
            drive/ec2.php
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git diff --cached --check
          git commit -m "Finish OOP boundaries for Drive runtime"
          git push origin HEAD:refactor/oop-drive-migration
