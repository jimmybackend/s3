name: One-time import verified ArcadeCloud Android 0.2.0 APK

on:
  push:
    branches: [feat/android-apk-020-repo-20261020]
    paths: ['.github/workflows/import-android-020.yml']

permissions:
  contents: write
  actions: read

jobs:
  import:
    if: github.repository == 'jimmybackend/s3' && github.ref == 'refs/heads/feat/android-apk-020-repo-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 39407463425
          artifact-ids: 12257238654
          github-token: ${{ github.token }}
          path: /tmp/arcadecloud-android-020
      - name: Verify exact APK and commit to feature branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/android-apk-020-repo-20261020"
          mapfile -t APK < <(find /tmp/arcadecloud-android-020 -type f -name 'app-debug.apk')
          test "${#APK[@]}" -eq 1
          printf '%s  %s\n' 'a2335b8190929ed1d86abc5a953cfdd6d53935eeb99bdc1cd5f94d363d0b6940' "${APK[0]}" | sha256sum -c -
          mkdir -p android-app/releases
          cp "${APK[0]}" android-app/releases/ArcadeCloud-Android-0.2.0-debug.apk
          file android-app/releases/ArcadeCloud-Android-0.2.0-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android-app/releases/ArcadeCloud-Android-0.2.0-debug.apk
          git commit -m 'build(android): include verified debug APK 0.2.0'
          git push origin HEAD:feat/android-apk-020-repo-20261020
