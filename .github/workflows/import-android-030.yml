name: One-time verified Android 0.3 APK import
on:
  push:
    branches: [build/android-030-debug-apk-20261020]
    paths: ['.github/workflows/import-android-030.yml']
permissions:
  contents: write
  actions: read
jobs:
  import:
    if: github.repository == 'jimmybackend/s3' && github.ref == 'refs/heads/build/android-030-debug-apk-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 39411673515
          artifact-ids: 12259099761
          github-token: ${{ github.token }}
          path: /tmp/arcadecloud-android-030
      - name: Validate exact APK from merged main and commit to branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "build/android-030-debug-apk-20261020"
          mapfile -t APK < <(find /tmp/arcadecloud-android-030 -type f -name 'app-debug.apk')
          test "${#APK[@]}" -eq 1
          printf '%s  %s\n' '7f6128b854f4d6dddbb7c05b2674f420ebe285fc7b80001526faa9c866f67441' "${APK[0]}" | sha256sum -c -
          mkdir -p android-app/releases
          cp "${APK[0]}" android-app/releases/ArcadeCloud-Android-0.3.0-debug.apk
          file android-app/releases/ArcadeCloud-Android-0.3.0-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android-app/releases/ArcadeCloud-Android-0.3.0-debug.apk
          git commit -m 'build(android): publish verified debug APK 0.3.0'
          git push origin HEAD:build/android-030-debug-apk-20261020
