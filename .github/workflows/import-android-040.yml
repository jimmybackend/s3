name: Import verified ArcadeCloud Android 0.4.0 debug APK

on:
  push:
    branches: [build/android-040-debug-apk-20261020]
    paths: ['.github/workflows/import-android-040.yml']

permissions:
  contents: write
  actions: read

jobs:
  import:
    if: github.repository == 'jimmybackend/s3' && github.ref == 'refs/heads/build/android-040-debug-apk-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 39415246092
          artifact-ids: 12261396213
          github-token: ${{ github.token }}
          path: /tmp/arcadecloud-android-040
      - name: Verify SHA-256 and commit to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "build/android-040-debug-apk-20261020"
          mapfile -t APK < <(find /tmp/arcadecloud-android-040 -type f -name 'app-debug.apk')
          test "${#APK[@]}" -eq 1
          printf '%s  %s\n' 'f35f405090b56580aebdb683f776ff41067c40f5a05d196389206f7d510e80b3' "${APK[0]}" | sha256sum -c -
          mkdir -p android-app/releases
          cp "${APK[0]}" android-app/releases/ArcadeCloud-Android-0.4.0-debug.apk
          file android-app/releases/ArcadeCloud-Android-0.4.0-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android-app/releases/ArcadeCloud-Android-0.4.0-debug.apk
          git commit -m 'build(android): publish verified debug APK 0.4.0'
          git push origin HEAD:build/android-040-debug-apk-20261020
