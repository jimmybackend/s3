name: One-time import ArcadeCloud Android 0.5.0 APK

on:
  push:
    branches: [build/android-050-debug-apk-20261020]
    paths: ['.github/workflows/import-android-050.yml']

permissions:
  contents: write
  actions: read

jobs:
  import:
    if: github.repository == 'jimmybackend/s3' && github.ref == 'refs/heads/build/android-050-debug-apk-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 39417108162
          artifact-ids: 12261379195
          github-token: ${{ github.token }}
          path: /tmp/arcadecloud-android-050
      - name: Verify APK SHA-256 before saving in repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "build/android-050-debug-apk-20261020"
          mapfile -t APK < <(find /tmp/arcadecloud-android-050 -type f -name 'app-debug.apk')
          test "${#APK[@]}" -eq 1
          printf '%s  %s\n' 'b257eaae2c1ec6166aae190d7bc52014c6a16b8693a8bbb415271cca1ad66585' "${APK[0]}" | sha256sum -c -
          mkdir -p android-app/releases
          cp "${APK[0]}" android-app/releases/ArcadeCloud-Android-0.5.0-debug.apk
          file android-app/releases/ArcadeCloud-Android-0.5.0-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android-app/releases/ArcadeCloud-Android-0.5.0-debug.apk
          git commit -m 'build(android): include verified 0.5.0 debug APK'
          git push origin HEAD:build/android-050-debug-apk-20261020
