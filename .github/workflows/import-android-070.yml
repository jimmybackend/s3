name: One-time import of verified ArcadeCloud Android 0.7.0 APK
on:
  push:
    branches: [build/android-070-debug-apk-20261020]
    paths: ['.github/workflows/import-android-070.yml']

permissions:
  contents: write
  actions: read

jobs:
  import:
    if: github.repository == 'jimmybackend/s3' && github.ref == 'refs/heads/build/android-070-debug-apk-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 39434258176
          artifact-ids: 12268434727
          github-token: ${{ github.token }}
          path: /tmp/arcadecloud-android-070
      - name: Verify SHA-256 and commit only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "build/android-070-debug-apk-20261020"
          mapfile -t APK < <(find /tmp/arcadecloud-android-070 -type f -name app-debug.apk)
          test "${#APK[@]}" -eq 1
          printf '%s  %s\n' '8874076b13171c8340774a7cd3bf288b395eb98fdcd9bf5b65bfb1bde9027502' "${APK[0]}" | sha256sum -c -
          mkdir -p android-app/releases
          cp "${APK[0]}" android-app/releases/ArcadeCloud-Android-0.7.0-debug.apk
          file android-app/releases/ArcadeCloud-Android-0.7.0-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android-app/releases/ArcadeCloud-Android-0.7.0-debug.apk
          git commit -m 'build(android): publish verified debug APK 0.7.0 for Samsung'
          git push origin HEAD:build/android-070-debug-apk-20261020
