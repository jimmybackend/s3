name: Initial setup validation

on:
  push:
    branches:
      - main
      - 'feat/bootstrap-web-setup'
    paths:
      - 'drive/setup/**'
      - 'drive/index.php'
      - 'drive/js/setup.js'
      - 'drive/js/federation-footer.js'
      - 'drive/src/Setup/**'
      - 'drive/src/Federation/FederationNodeAdminService.php'
      - 'drive/src/Admin/ManagedRuntimeEnvironment.php'
      - 'drive/src/Admin/PrivilegedServerHelper.php'
      - 'drive/bin/arcadecloud-drive-admin-helper.php'
      - 'drive/bin/install_arcadecloud_admin_helper.sh'
      - 'drive/bin/install_arcadecloud.sh'
      - 'drive/bin/install_arcadecloud_server.sh'
      - 'drive/bin/uninstall_arcadecloud.sh'
      - 'bootstrap_arcadecloud.sh'
      - 'drive/tests/setup_bootstrap_smoke.php'
      - 'drive/tests/setup_entry_guard_smoke.php'
      - 'drive/tests/setup_finalize_contract_smoke.php'
      - 'drive/docs/INITIAL_SETUP.md'
      - 'drive/docs/INSTALLATION_PREPARATION.md'
      - 'drive/docs/AUTOMATED_INSTALLER.md'
      - 'drive/docs/UNINSTALLATION.md'
      - '.github/workflows/initial-setup.yml'
  pull_request:
    paths:
      - 'drive/setup/**'
      - 'drive/index.php'
      - 'drive/login.php'
      - 'drive/js/setup.js'
      - 'drive/js/federation-footer.js'
      - 'drive/src/Setup/**'
      - 'drive/src/Federation/FederationNodeAdminService.php'
      - 'drive/src/Admin/ManagedRuntimeEnvironment.php'
      - 'drive/src/Admin/PrivilegedServerHelper.php'
      - 'drive/bin/arcadecloud-drive-admin-helper.php'
      - 'drive/bin/install_arcadecloud_admin_helper.sh'
      - 'drive/bin/install_arcadecloud.sh'
      - 'drive/bin/install_arcadecloud_server.sh'
      - 'drive/bin/uninstall_arcadecloud.sh'
      - 'bootstrap_arcadecloud.sh'
      - 'drive/tests/setup_bootstrap_smoke.php'
      - 'drive/tests/setup_entry_guard_smoke.php'
      - 'drive/tests/setup_finalize_contract_smoke.php'
      - 'drive/docs/INITIAL_SETUP.md'
      - 'drive/docs/INSTALLATION_PREPARATION.md'
      - 'drive/docs/AUTOMATED_INSTALLER.md'
      - '.github/workflows/initial-setup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          php -l drive/index.php
          php -l drive/setup/index.php
          php -l drive/setup/api.php
          php -l drive/src/Setup/BootstrapSetupAuth.php
          php -l drive/src/Setup/SetupEntryGuard.php
          php -l drive/src/Setup/SetupConfigurationService.php
          php -l drive/src/Setup/SuperAdminBootstrapService.php
          php -l drive/src/Federation/FederationConfig.php
          php -l drive/src/Admin/ManagedRuntimeEnvironment.php
          php -l drive/src/Admin/PrivilegedServerHelper.php
          php -l drive/bin/arcadecloud-drive-admin-helper.php
          php -l drive/bin/federation_endpoint_refresh.php
          php -l drive/tests/setup_bootstrap_smoke.php
          php -l drive/tests/setup_entry_guard_smoke.php
          php -l drive/tests/setup_finalize_contract_smoke.php

      - name: Validate JavaScript and installer
        run: |
          set -euo pipefail
          node --check drive/js/setup.js
          node --check drive/js/federation-footer.js
          bash -n drive/bin/install_arcadecloud_admin_helper.sh
          bash -n drive/bin/install_arcadecloud_server.sh
          bash -n drive/bin/install_arcadecloud.sh
          bash -n drive/bin/uninstall_arcadecloud.sh
          bash -n bootstrap_arcadecloud.sh

      - name: Bootstrap authentication smoke test
        run: |
          php drive/tests/setup_bootstrap_smoke.php
          php drive/tests/setup_entry_guard_smoke.php
          php drive/tests/setup_finalize_contract_smoke.php

      - name: Setup security boundary guards
        run: |
          set -euo pipefail
          grep -q "token_hash" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "password_hash('arcadecloud'" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "requireServerOperator" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "php_user" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "bootstrap-complete" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "bootstrap-finalize" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "setup_finalize" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "assertActiveSuperadminExists" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "setup.lock" drive/src/Setup/BootstrapSetupAuth.php
          grep -q "SetupEntryGuard" drive/index.php
          grep -q "isSetupPending" drive/src/Setup/SetupEntryGuard.php
          grep -q "system_role, chat, userstatus" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "'superadmin'" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "\$role = 'Administración'" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "assertPersistedSuperadmin" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "finalizeBootstrapInstallation" drive/src/Setup/SuperAdminBootstrapService.php
          ! grep -q "completeBootstrapSetup" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "adminBirthdate" drive/setup/index.php
          grep -q "adminMobilephone" drive/setup/index.php
          grep -q "'birthdate' => \$this->post('birthdate')" drive/src/Setup/SetupApiController.php
          grep -q "\\DateTimeImmutable::createFromFormat" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "countUsers" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "INSERT INTO Users" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "birthdate, email, password" drive/src/Setup/SuperAdminBootstrapService.php
          ! grep -q "UPDATE Users SET birthdate" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "supervisor temporal se conserva" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "X-ArcadeCloud-Setup-CSRF" drive/js/setup.js
          ! grep -q 'data-save-group="smtp"' drive/setup/index.php
          ! grep -q "AWS_SESSION_TOKEN" drive/js/setup.js
          grep -q "aws_ready" drive/src/Setup/SetupApiController.php
          grep -q "assertBasicConfigurationReady" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "finalización automática" drive/docs/INITIAL_SETUP.md
          grep -q "ARCADECLOUD_FEDERATION_ENABLED" drive/bin/install_arcadecloud.sh
          grep -Fq '"ARCADECLOUD_PUBLIC_URL": f"http://{ip}"' drive/bin/install_arcadecloud.sh
          grep -Fq '"ARCADECLOUD_FEDERATION_URL": f"http://{ip}/federationcloud/"' drive/bin/install_arcadecloud.sh
          grep -Fq '"ARCADECLOUD_FEDERATION_ENABLED": "true"' drive/bin/install_arcadecloud.sh
          grep -q "federation_runtime_enabled" drive/bin/install_arcadecloud.sh
          grep -q "prepare_setup_activation" drive/bin/install_arcadecloud.sh
          grep -q "bootstrap-reset" drive/bin/install_arcadecloud.sh
          grep -q "URL DE SETUP" drive/bin/install_arcadecloud.sh
          ! grep -q "Endpoint público objetivo después de HTTPS" drive/bin/install_arcadecloud.sh
          grep -q "identity-create" drive/bin/install_arcadecloud.sh
          grep -q "install_arcadecloud_server.sh" drive/bin/install_arcadecloud.sh
          grep -q "install_arcadecloud_updater.sh" drive/bin/install_arcadecloud.sh
          grep -q "install_updater" drive/bin/install_arcadecloud.sh
          grep -q "select_certbot_bin" drive/bin/install_arcadecloud.sh
          grep -q -- "--finalize-from-setup" drive/bin/install_arcadecloud.sh
          grep -q "SUDO_USER" drive/bin/install_arcadecloud.sh
          grep -q "arcadecloud-federation-https.service" drive/bin/install_arcadecloud.sh
          grep -q "federation_catalog_migrate.php" drive/bin/install_arcadecloud.sh
          migrate_line="$(grep -n 'federation_catalog_migrate.php' drive/bin/install_arcadecloud.sh | head -1 | cut -d: -f1)"
          refresh_line="$(grep -n 'federation_endpoint_refresh.php.*--require-directory' drive/bin/install_arcadecloud.sh | head -1 | cut -d: -f1)"
          test -n "$migrate_line" -a -n "$refresh_line"
          test "$migrate_line" -lt "$refresh_line"
          grep -q -- "--require-directory" drive/bin/install_arcadecloud.sh
          grep -q "Nodo presentado al seed global" drive/bin/install_arcadecloud.sh
          grep -q "CERTBOT_VENV" drive/bin/install_arcadecloud_server.sh
          grep -q "certbot>=5.4" drive/bin/install_arcadecloud_server.sh
          grep -q "select_certbot_python" drive/bin/install_arcadecloud_server.sh
          grep -q "python3.11" drive/bin/install_arcadecloud_server.sh
          grep -q "python_version_at_least_310" drive/bin/install_arcadecloud_server.sh
          grep -q "arcadecloud-certbot" drive/bin/install_arcadecloud_server.sh
          grep -q -- "--dry-run" drive/bin/uninstall_arcadecloud.sh
          grep -q "KEEP_REPOSITORY" drive/bin/uninstall_arcadecloud.sh
          grep -q "KEEP_CONFIG" drive/bin/uninstall_arcadecloud.sh
          grep -q "NO se eliminarán" drive/bin/uninstall_arcadecloud.sh
          grep -q "Managed by ArcadeCloud installer." drive/bin/uninstall_arcadecloud.sh
          grep -q 'run_quiet systemctl disable --now' drive/bin/uninstall_arcadecloud.sh
          grep -q 'run_quiet systemctl reset-failed' drive/bin/uninstall_arcadecloud.sh
          grep -q -- "--require-directory" drive/bin/federation_endpoint_refresh.php
          grep -q "dnf install -y" drive/bin/install_arcadecloud_server.sh
          grep -q "for candidate in php8.5 php8.4 php8.3 php8.2 php8.1" drive/bin/install_arcadecloud_server.sh
          grep -Fq '"$php_family-fpm"' drive/bin/install_arcadecloud_server.sh
          grep -q '"curl:curl"' drive/bin/install_arcadecloud_server.sh
          grep -q 'command_exists "$command_name"' drive/bin/install_arcadecloud_server.sh
          grep -q "127.0.0.1:9075" drive/bin/install_arcadecloud_server.sh
          grep -q "nginx -t" drive/bin/install_arcadecloud_server.sh
          grep -q "location ^~ /.well-known/acme-challenge/" drive/bin/install_arcadecloud_server.sh
          grep -q "hash_file('sha384'" drive/bin/install_arcadecloud_server.sh
          grep -q "COMPOSER_ALLOW_SUPERUSER=1 composer --version" drive/bin/install_arcadecloud_server.sh
          grep -q "git pull --ff-only" bootstrap_arcadecloud.sh
          ! grep -Eq 'curl[^|]*\|[[:space:]]*(bash|sh)' drive/bin/install_arcadecloud_server.sh bootstrap_arcadecloud.sh
          grep -q "ARCADECLOUD_SMTP_BCC" drive/src/Admin/ManagedRuntimeEnvironment.php
          grep -q "ready' => false" drive/src/Federation/FederationNodeAdminService.php
          ! grep -q "app_bootstrap.php" drive/setup/api.php
          ! grep -q "require.*db.php" drive/setup/api.php
          ! grep -Eq '\b(shell_exec|exec|system|passthru|popen)\s*\(' drive/setup/api.php drive/src/Setup/*.php

      - name: Diff whitespace check
        run: git diff --check