name: Initial setup validation

on:
  push:
    branches:
      - main
      - 'feat/bootstrap-web-setup'
    paths:
      - 'drive/setup/**'
      - 'drive/js/setup.js'
      - 'drive/src/Setup/**'
      - 'drive/src/Admin/ManagedRuntimeEnvironment.php'
      - 'drive/src/Admin/PrivilegedServerHelper.php'
      - 'drive/bin/arcadecloud-drive-admin-helper.php'
      - 'drive/bin/install_arcadecloud_admin_helper.sh'
      - 'drive/bin/install_arcadecloud.sh'
      - 'drive/bin/install_arcadecloud_server.sh'
      - 'bootstrap_arcadecloud.sh'
      - 'drive/tests/setup_bootstrap_smoke.php'
      - 'drive/docs/INITIAL_SETUP.md'
      - 'drive/docs/INSTALLATION_PREPARATION.md'
      - 'drive/docs/AUTOMATED_INSTALLER.md'
      - '.github/workflows/initial-setup.yml'
  pull_request:
    paths:
      - 'drive/setup/**'
      - 'drive/js/setup.js'
      - 'drive/src/Setup/**'
      - 'drive/src/Admin/ManagedRuntimeEnvironment.php'
      - 'drive/src/Admin/PrivilegedServerHelper.php'
      - 'drive/bin/arcadecloud-drive-admin-helper.php'
      - 'drive/bin/install_arcadecloud_admin_helper.sh'
      - 'drive/bin/install_arcadecloud.sh'
      - 'drive/tests/setup_bootstrap_smoke.php'
      - 'drive/docs/INITIAL_SETUP.md'
      - 'drive/docs/INSTALLATION_PREPARATION.md'
      - '.github/workflows/initial-setup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          php -l drive/setup/index.php
          php -l drive/setup/api.php
          php -l drive/src/Setup/BootstrapSetupAuth.php
          php -l drive/src/Setup/SetupConfigurationService.php
          php -l drive/src/Setup/SuperAdminBootstrapService.php
          php -l drive/src/Admin/ManagedRuntimeEnvironment.php
          php -l drive/src/Admin/PrivilegedServerHelper.php
          php -l drive/bin/arcadecloud-drive-admin-helper.php
          php -l drive/tests/setup_bootstrap_smoke.php

      - name: Validate JavaScript and installer
        run: |
          set -euo pipefail
          node --check drive/js/setup.js
          bash -n drive/bin/install_arcadecloud_admin_helper.sh
          bash -n drive/bin/install_arcadecloud_server.sh
          bash -n drive/bin/install_arcadecloud.sh
          bash -n bootstrap_arcadecloud.sh

      - name: Bootstrap authentication smoke test
        run: php drive/tests/setup_bootstrap_smoke.php

      - name: Setup security boundary guards
        run: |
          set -euo pipefail
          grep -q "token_hash" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "password_hash('arcadecloud'" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "requireServerOperator" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "php_user" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "bootstrap-complete" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "setup.lock" drive/src/Setup/BootstrapSetupAuth.php
          grep -q "system_role, chat, userstatus" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "'superadmin'" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "X-ArcadeCloud-Setup-CSRF" drive/js/setup.js
          ! grep -q 'data-save-group="smtp"' drive/setup/index.php
          ! grep -q "AWS_SESSION_TOKEN" drive/js/setup.js
          grep -q "aws_ready" drive/src/Setup/SetupApiController.php
          grep -q "assertBasicConfigurationReady" drive/src/Setup/SuperAdminBootstrapService.php
          grep -q "install_arcadecloud.sh --finalize" drive/docs/INITIAL_SETUP.md
          grep -q "ARCADECLOUD_FEDERATION_ENABLED" drive/bin/install_arcadecloud.sh
          grep -q "identity-create" drive/bin/install_arcadecloud.sh
          grep -q "install_arcadecloud_server.sh" drive/bin/install_arcadecloud.sh
          grep -q "dnf install -y" drive/bin/install_arcadecloud_server.sh
          grep -q "127.0.0.1:9075" drive/bin/install_arcadecloud_server.sh
          grep -q "nginx -t" drive/bin/install_arcadecloud_server.sh
          grep -q "hash_file('sha384'" drive/bin/install_arcadecloud_server.sh
          grep -q "git pull --ff-only" bootstrap_arcadecloud.sh
          ! grep -Eq 'curl[^|]*\|[[:space:]]*(bash|sh)' drive/bin/install_arcadecloud_server.sh bootstrap_arcadecloud.sh
          grep -q "ARCADECLOUD_SMTP_BCC" drive/src/Admin/ManagedRuntimeEnvironment.php
          ! grep -q "app_bootstrap.php" drive/setup/api.php
          ! grep -q "require.*db.php" drive/setup/api.php
          ! grep -Eq '\b(shell_exec|exec|system|passthru|popen)\s*\(' drive/setup/api.php drive/src/Setup/*.php

      - name: Diff whitespace check
        run: git diff --check
