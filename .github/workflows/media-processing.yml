name: Media processing worker

on:
  pull_request:
    paths:
      - 'drive/src/Media/**'
      - 'drive/src/Activity/AwsUnitPriceCatalog.php'
      - 'drive/src/Console/MediaProcessingWorkerCommand.php'
      - 'drive/src/Http/Controller/MediaProcessingController.php'
      - 'drive/src/Http/Controller/BackgroundTaskController.php'
      - 'drive/bin/media_processing_worker.php'
      - 'drive/bin/install_media_processing_worker.sh'
      - 'drive/bin/media_worker_node_bootstrap.sh'
      - 'drive/media_processing.php'
      - 'drive/js/media-processing.js'
      - 'drive/js/aws-comprehend.js'
      - 'drive/js/background-tasks.js'
      - 'drive/bloque_archivos.php'
      - 'drive/s3.php'
      - 'drive/tests/database_schema_contract_smoke.php'
      - 'drive/tests/media_processing_contract_smoke.php'
      - 'drive/tests/media_processing_small_file_smoke.sh'
      - 'drive/bin/install_arcadecloud_server.sh'
      - 'adbbmis1_Cloud.sql'
      - '.github/workflows/media-processing.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PHP syntax
        run: |
          php -l drive/src/Media/MediaProcessingJobRepository.php
          php -l drive/src/Media/MediaProcessingService.php
          php -l drive/src/Media/MediaWorkerNodeService.php
          php -l drive/src/Media/MediaWorkerNodeSessionRepository.php
          php -l drive/src/Activity/AwsUnitPriceCatalog.php
          php -l drive/src/Console/MediaProcessingWorkerCommand.php
          php -l drive/src/Http/Controller/MediaProcessingController.php
          php -l drive/src/Http/Controller/BackgroundTaskController.php
          php -l drive/bin/media_processing_worker.php
          php -l drive/media_processing.php
          php -l drive/bloque_archivos.php
          php -l drive/s3.php
          php -l drive/tests/database_schema_contract_smoke.php
          php -l drive/tests/media_processing_contract_smoke.php
      - name: JavaScript syntax
        run: |
          node --check drive/js/media-processing.js
          node --check drive/js/aws-comprehend.js
          node --check drive/js/background-tasks.js
      - name: Shell syntax
        run: |
          bash -n drive/bin/install_media_processing_worker.sh
          bash -n drive/bin/media_worker_node_bootstrap.sh
          bash -n drive/tests/media_processing_small_file_smoke.sh
      - name: Canonical schema contract
        run: php drive/tests/database_schema_contract_smoke.php
      - name: Media processing contract
        run: php drive/tests/media_processing_contract_smoke.php
      - name: Small-file FFmpeg integration
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          bash drive/tests/media_processing_small_file_smoke.sh
