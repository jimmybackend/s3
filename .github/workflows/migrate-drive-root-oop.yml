name: Migrate Drive root OOP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-drive-root-oop.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate and audit
        run: python3 .github/scripts/migrate_drive_root_oop.py

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/migrate-drive-root-oop.yml
          git rm .github/scripts/migrate_drive_root_oop.py
          git add -A
          git commit -m 'Move Drive to root, remove video calls, add OOP core'
          git push origin main
