name: Normalize AWS modal scripts

on:
  push:
    branches: ['refactor/oop-drive-migration']
    paths:
      - '.github/workflows/normalize-aws-modal-scripts.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize script tags
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('drive/s3.php')
          t = p.read_text(encoding='utf-8')
          versioned = '<script src="js/polly.js?v=20260905-aws-actions1"></script>'
          plain = '<script src="js/polly.js"></script>'

          # Convert the first historical unversioned include to the versioned one.
          if plain in t:
              t = t.replace(plain, versioned, 1)

          # Keep exactly one versioned Polly include.
          first = t.find(versioned)
          if first < 0:
              raise SystemExit('POLLY_INCLUDE_NOT_FOUND')
          second = t.find(versioned, first + len(versioned))
          if second >= 0:
              t = t[:second] + t[second + len(versioned):]

          comprehend_plain = '<script src="js/aws-comprehend.js"></script>'
          comprehend_versioned = '<script src="js/aws-comprehend.js?v=20260905-aws-actions1"></script>'
          if comprehend_plain in t:
              t = t.replace(comprehend_plain, comprehend_versioned, 1)

          if t.count(versioned) != 1:
              raise SystemExit('POLLY_INCLUDE_COUNT_INVALID')
          if t.count(comprehend_versioned) != 1:
              raise SystemExit('COMPREHEND_INCLUDE_COUNT_INVALID')

          p.write_text(t, encoding='utf-8')
          print('AWS_MODAL_SCRIPTS_NORMALIZED')
          PY

      - name: Validate
        run: |
          set -euo pipefail
          php -l drive/s3.php >/dev/null
          node --check drive/js/polly.js
          node --check drive/js/aws-comprehend.js
          test "$(grep -Fc 'js/polly.js?v=20260905-aws-actions1' drive/s3.php)" -eq 1
          test "$(grep -Fc 'js/aws-comprehend.js?v=20260905-aws-actions1' drive/s3.php)" -eq 1
          ! grep -F '<script src="js/polly.js"></script>' drive/s3.php
          git diff --check
          echo PHP_OK
          echo JS_OK
          echo AWS_MODAL_SCRIPTS_OK
          echo DIFF_OK

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive/s3.php
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git commit -m "Version AWS modal scripts"
          git push origin HEAD:refactor/oop-drive-migration
