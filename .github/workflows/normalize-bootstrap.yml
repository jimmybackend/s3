name: Normalize app bootstrap includes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-bootstrap.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize PHP includes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('public_html/s3-servicios-aws')
          bootstrap_name = 'app_bootstrap.php'

          vendor_re = re.compile(
              r"^\s*(?:require|require_once|include|include_once)\s*(?:\(\s*)?.*vendor/autoload\.php.*;\s*(?://.*)?$",
              re.I,
          )
          db_re = re.compile(
              r"^\s*(?:require|require_once|include|include_once)\s*(?:\(\s*)?.*(?:db-s3|db)\.php.*;\s*(?://.*)?$",
              re.I,
          )

          changed = []

          for path in sorted(root.glob('*.php')):
              if path.name == bootstrap_name:
                  continue

              raw = path.read_text(encoding='utf-8')
              lines = raw.splitlines(keepends=True)

              removed_dependency = False
              kept = []
              for line in lines:
                  if vendor_re.match(line) or db_re.match(line):
                      removed_dependency = True
                      continue
                  kept.append(line)

              if not removed_dependency:
                  continue

              text = ''.join(kept)

              if 'app_bootstrap.php' not in text:
                  bootstrap_line = "require_once __DIR__ . '/app_bootstrap.php';\n"
                  all_lines = text.splitlines(keepends=True)
                  insert_at = 1 if all_lines and all_lines[0].lstrip().startswith('<?php') else 0

                  for i, line in enumerate(all_lines[:12]):
                      if re.match(r'^\s*declare\s*\(', line):
                          insert_at = i + 1
                          break

                  all_lines.insert(insert_at, bootstrap_line)
                  text = ''.join(all_lines)

              if text != raw:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Archivos PHP normalizados: {len(changed)}')
          for path in changed:
              print(path)
          PY

      - name: Remove one-time workflow and commit normalization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/normalize-bootstrap.yml
          git add public_html/s3-servicios-aws
          git commit -m 'Normalize PHP pages to app bootstrap'
          git push origin main
