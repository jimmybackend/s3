name: Office document behavioral regression

on:
  pull_request:
    paths:
      - 'drive/src/Office/**'
      - 'drive/src/Storage/FileRecordRepository.php'
      - 'drive/tests/office_conditional_save_regression.php'
      - '.github/workflows/office-document-regression.yml'
  push:
    branches: [main]
    paths:
      - 'drive/src/Office/**'
      - 'drive/src/Storage/FileRecordRepository.php'
      - 'drive/tests/office_conditional_save_regression.php'
      - '.github/workflows/office-document-regression.yml'

permissions:
  contents: read

jobs:
  document-save:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, curl, simplexml
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP and JavaScript syntax
        run: |
          set -euo pipefail
          php -l drive/src/Office/OfficeDocumentStorageService.php
          php -l drive/tests/office_conditional_save_regression.php
          node --check drive/js/so.js
      - name: Office service and repository regression
        env:
          ARCADECLOUD_ISOLATED_TEST: '1'
        run: php drive/tests/office_conditional_save_regression.php
      - name: Diff check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" HEAD
