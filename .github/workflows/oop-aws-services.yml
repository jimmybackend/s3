name: OOP AWS file services
on:
  push:
    branches: [main]
    paths: ['.github/scripts/oop_aws_services.py','.github/workflows/oop-aws-services.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 .github/scripts/oop_aws_services.py
      - name: Validate PHP
        run: |
          php -l Config-s3.php
          php -l drive/src/Http/Request.php
          for f in drive/src/Aws/FileMetadataRepository.php drive/src/Aws/GeneratedFileRepository.php drive/src/Aws/TextractFileService.php drive/src/Aws/TranslateFileService.php drive/src/Aws/RekognitionFileService.php drive/src/Aws/PollyFileService.php drive/src/Http/Controller/AwsFileController.php; do php -l "$f"; done
          for f in procesar_textract.php traducir_archivo.php rekognition_labels.php polly_list_voices.php polly_cargar_texto.php polly_tts.php comprehend_archivo.php; do
            php -l "drive/$f"
            ! grep -q '\$_POST\|\$_GET\|session_start\|\$db_connection\|new Aws\\\|Config::ACCESS_KEY\|^function ' "drive/$f"
          done
      - name: Audit central clients
        run: |
          set -euo pipefail
          grep -q 'getPolly' Config-s3.php
          grep -q 'getTranslate' Config-s3.php
          grep -q 'getTextract' Config-s3.php
          grep -q 'getRekognition' Config-s3.php
          grep -q 'requireReadableByKey' drive/src/Aws/TextractFileService.php
          grep -q 'requireReadableByKey' drive/src/Aws/PollyFileService.php
          grep -q 'GeneratedFileRepository' drive/src/Aws/PollyFileService.php
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Config-s3.php drive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move AWS file actions behind OOP services"
          git push origin main
