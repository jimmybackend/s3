name: OOP HTTP controllers

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/oop_http_controllers.py'
      - '.github/workflows/oop-http-controllers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controllers
        run: python3 .github/scripts/oop_http_controllers.py

      - name: PHP lint
        run: |
          php -l drive/src/Http/Request.php
          php -l drive/src/Http/Controller/AbstractJsonController.php
          php -l drive/src/Http/Controller/FileMutationController.php
          php -l drive/src/Http/Controller/FolderMutationController.php
          for f in eliminar_archivo.php delete_multiple.php mover_archivo.php move_multiple.php renombrar_archivo.php crear_carpeta.php eliminar_carpeta.php mover_carpeta.php renombrar_carpeta.php; do php -l "drive/$f"; done

      - name: Audit thin endpoints
        run: |
          set -euo pipefail
          for f in eliminar_archivo.php delete_multiple.php mover_archivo.php move_multiple.php renombrar_archivo.php crear_carpeta.php eliminar_carpeta.php mover_carpeta.php renombrar_carpeta.php; do
            ! grep -q 'session_start' "drive/$f"
            ! grep -q '\$_POST' "drive/$f"
            ! grep -q '\$db_connection' "drive/$f"
            ! grep -q 'S3Manager' "drive/$f"
          done
          grep -q 'guardAuthenticated' drive/src/Http/Controller/AbstractJsonController.php
          grep -q 'normalizeForUser' drive/src/Http/Controller/FileMutationController.php
          grep -q 'normalizeForUser' drive/src/Http/Controller/FolderMutationController.php

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Move file and folder mutations behind OOP controllers"
          git push origin main
