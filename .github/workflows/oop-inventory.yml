name: OOP architecture inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/oop_inventory.py'
      - '.github/workflows/oop-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate inventory
        run: python3 .github/scripts/oop_inventory.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive/docs/OOP_AUDIT.md drive/docs/oop_inventory.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Document OOP architecture inventory"
          git push origin main
