name: OOP architecture inventory

on:
  push:
    branches: [main]
    paths:
      - 'drive/**/*.php'
      - 'drive/**/*.js'
      - '.github/scripts/oop_inventory.py'
      - '.github/workflows/oop-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: drive-generated-docs-main
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate inventory
        run: python3 .github/scripts/oop_inventory.py

      - name: Propose updated OOP inventory
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/oop-architecture-inventory
          base: main
          add-paths: |
            drive/docs/OOP_AUDIT.md
            drive/docs/oop_inventory.json
          commit-message: "docs: refresh OOP architecture inventory"
          title: "docs: refresh OOP architecture inventory"
          body: |
            Automatically regenerated by the OOP architecture inventory workflow.
            Only the generated audit and JSON inventory are included.

            Review the generated changes and required checks before merging to main.
