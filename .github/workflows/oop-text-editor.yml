name: OOP text editor migration
on:
  push:
    branches: [main]
    paths: ['.github/scripts/oop_text_editor.py','.github/workflows/oop-text-editor.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 .github/scripts/oop_text_editor.py
      - name: Validate
        run: |
          php -l drive/src/Http/Request.php
          php -l drive/src/Application/TextFileService.php
          php -l drive/src/Application/PhpLintService.php
          php -l drive/src/Http/Controller/TextEditorController.php
          php -l drive/leer_texto.php
          php -l drive/guardar_texto.php
          php -l drive/validar_php.php
          for f in leer_texto.php guardar_texto.php validar_php.php; do
            ! grep -q '\$_POST\|\$_GET\|session_start\|S3Manager' "drive/$f"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move text editing behind OOP services"
          git push origin main
