name: OOP Transcribe migration
on:
  push:
    branches: [main]
    paths: ['.github/scripts/oop_transcribe.py','.github/workflows/oop-transcribe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 .github/scripts/oop_transcribe.py
      - name: Validate
        run: |
          php -l Config-s3.php
          php -l drive/src/Aws/TranscriptionFileService.php
          php -l drive/src/Http/Controller/TranscriptionController.php
          php -l drive/transcribir_iniciar.php
          php -l drive/transcribir_estado.php
          for f in transcribir_iniciar.php transcribir_estado.php; do
            ! grep -q '\$_POST\|\$_GET\|session_start\|\$db_connection\|new Aws\\\|Config::ACCESS_KEY\|^function ' "drive/$f"
          done
          grep -q 'getTranscribe' Config-s3.php
          grep -q 'requireReadableByKey' drive/src/Aws/TranscriptionFileService.php
          grep -q 'GeneratedFileRepository' drive/src/Aws/TranscriptionFileService.php
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Config-s3.php drive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move Transcribe workflow behind OOP services"
          git push origin main
