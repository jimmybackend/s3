name: OOP upload cleanup validation

on:
  pull_request:
    paths:
      - 'drive/upload/**'
      - 'drive/src/Upload/**'
      - 'drive/src/Core/DriveApplication.php'
      - 'drive/src/Console/UploadCleanupCommand.php'
      - 'drive/src/Http/Controller/UploadCleanupController.php'
      - 'drive/tests/chunked_upload_cleanup_regression.php'
      - '.github/workflows/oop-upload-cleanup.yml'
  push:
    branches: [main]
    paths:
      - 'drive/upload/**'
      - 'drive/src/Upload/**'
      - 'drive/src/Core/DriveApplication.php'
      - 'drive/tests/chunked_upload_cleanup_regression.php'
      - '.github/workflows/oop-upload-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, simplexml
          tools: composer:v2
      - name: Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          set -euo pipefail
          find drive/src/Upload drive/upload -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l drive/src/Core/DriveApplication.php
          php -l drive/src/Console/UploadCleanupCommand.php
          php -l drive/src/Http/Controller/UploadCleanupController.php
          php -l drive/tests/chunked_upload_cleanup_regression.php
      - name: Behavioral regression (no production services)
        run: php drive/tests/chunked_upload_cleanup_regression.php
      - name: JavaScript compatibility
        run: |
          set -euo pipefail
          node --check drive/js/upload-center.js
          node --check drive/js/upload-destination.js
          node drive/tests/web_os_upload_context_functional.js
      - name: Diff check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" HEAD
