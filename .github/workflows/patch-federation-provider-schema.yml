name: Patch Federation Provider Authorizations Schema

on:
  push:
    branches:
      - feature/federation-provider-approvals

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/federation-provider-approvals

      - name: Patch central SQL schema
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64

          path = Path('adbbmis1_Cloud.sql')
          text = path.read_text(encoding='utf-8')
          encoded = ''

          if 'CREATE TABLE IF NOT EXISTS `FederationNodeAuthorizations`' not in text:
              marker = "--\n-- Estructura de tabla para la tabla `FileVersions`\n--\n"
              pos = text.index(marker)
              block = base64.b64decode(encoded).decode('utf-8')
              text = text[:pos] + block + text[pos:]
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -q 'CREATE TABLE IF NOT EXISTS `FederationNodeAuthorizations`' adbbmis1_Cloud.sql
          grep -q 'UNIQUE KEY `uq_federation_node_authorization` (`OriginNodeId`,`ProviderNodeId`)' adbbmis1_Cloud.sql

      - name: Commit schema and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-federation-provider-schema.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add provider authorizations to central schema'
          git push origin HEAD:feature/federation-provider-approvals
