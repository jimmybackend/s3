name: Patch Federation Provider Authorizations Schema

on:
  push:
    branches:
      - feature/federation-provider-approvals

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/federation-provider-approvals

      - name: Patch central SQL schema
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('adbbmis1_Cloud.sql')
          text = path.read_text(encoding='utf-8')

          if 'CREATE TABLE IF NOT EXISTS `FederationNodeAuthorizations`' not in text:
              marker = "--\n-- Estructura de tabla para la tabla `FileVersions`\n--\n"
              pos = text.index(marker)
              block = """--
-- Estructura de tabla para la tabla `FederationNodeAuthorizations`
--

DROP TABLE IF EXISTS `FederationNodeAuthorizations`;
CREATE TABLE IF NOT EXISTS `FederationNodeAuthorizations` (
  `id_` bigint UNSIGNED NOT NULL AUTO_INCREMENT,
  `OriginNodeId` varchar(64) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
  `ProviderNodeId` varchar(64) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
  `Role` enum('provider','mirror') NOT NULL DEFAULT 'provider',
  `Scope` enum('all_allowed_resources','selected_resources') NOT NULL DEFAULT 'all_allowed_resources',
  `Status` enum('pending','active','revoked','blocked') NOT NULL DEFAULT 'pending',
  `OriginSignature` varchar(256) CHARACTER SET ascii COLLATE ascii_bin DEFAULT NULL,
  `RequestedAt` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
  `AuthorizedAt` datetime DEFAULT NULL,
  `LastSeen` datetime DEFAULT NULL,
  `RevokedAt` datetime DEFAULT NULL,
  PRIMARY KEY (`id_`),
  UNIQUE KEY `uq_federation_node_authorization` (`OriginNodeId`,`ProviderNodeId`),
  KEY `idx_federation_provider` (`ProviderNodeId`,`Status`),
  KEY `idx_federation_origin` (`OriginNodeId`,`Status`)
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

-- --------------------------------------------------------

"""
              text = text[:pos] + block + text[pos:]
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -q 'CREATE TABLE IF NOT EXISTS `FederationNodeAuthorizations`' adbbmis1_Cloud.sql
          grep -q 'UNIQUE KEY `uq_federation_node_authorization` (`OriginNodeId`,`ProviderNodeId`)' adbbmis1_Cloud.sql

      - name: Commit schema and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-federation-provider-schema.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add provider authorizations to central schema'
          git push origin HEAD:feature/federation-provider-approvals
