name: Private admin UI validation

on:
  pull_request:
    branches: ['main']
    paths:
      - 'drive/bloque_carpetas.php'
      - 'drive/ec2.php'
      - 'drive/server-console.php'
      - 'drive/aws.php'
      - 'drive/bin/arcadecloud-drive-admin-helper.php'
      - 'drive/src/Admin/PrivilegedServerHelper.php'
      - 'drive/src/Admin/ServerConsoleService.php'
      - 'drive/src/Http/Controller/ServerConsoleController.php'
      - 'drive/personal_aws_bootstrap.php'
      - 'drive/src/Aws/PersonalAwsRuntime.php'
      - 'drive/src/Http/Controller/PersonalAwsController.php'
      - 'drive/src/View/PersonalAwsPageRenderer.php'
      - 'drive/css/personal-tools.css'
      - 'drive/js/theme-state-bridge.js'
      - '.github/workflows/private-admin-ui.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: PHP syntax
        run: |
          set -euo pipefail
          php -l drive/bloque_carpetas.php
          php -l drive/ec2.php
          php -l drive/server-console.php
          php -l drive/aws.php
          php -l drive/bin/arcadecloud-drive-admin-helper.php
          php -l drive/src/Admin/PrivilegedServerHelper.php
          php -l drive/src/Admin/ServerConsoleService.php
          php -l drive/src/Http/Controller/ServerConsoleController.php
          php -l drive/personal_aws_bootstrap.php
          php -l drive/src/Aws/PersonalAwsRuntime.php
          php -l drive/src/Http/Controller/PersonalAwsController.php
          php -l drive/src/View/PersonalAwsPageRenderer.php

      - name: Personal AWS emergency access contracts
        run: |
          set -euo pipefail
          grep -q "personal_aws_bootstrap.php" drive/aws.php
          grep -q "personal_aws_bootstrap.php" drive/ec2.php
          ! grep -q "app_bootstrap.php" drive/aws.php
          ! grep -q "app_bootstrap.php" drive/ec2.php
          grep -q "passwordHash()" drive/ec2.php
          ! grep -q "actionPasswordHash()" drive/ec2.php
          grep -q "action-modal-backdrop" drive/ec2.php
          grep -q "action-modal" drive/ec2.php

      - name: Restricted server console contracts
        run: |
          set -euo pipefail
          php drive/tests/server_console_contract_smoke.php
          grep -q "isServerConsoleSuperAdmin" drive/ec2.php
          grep -q "server-console.php" drive/ec2.php
          grep -q "server_console" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "bypass_shell" drive/bin/arcadecloud-drive-admin-helper.php

      - name: Theme integration contracts
        run: |
          set -euo pipefail
          test -f drive/css/personal-tools.css
          grep -q 'personal-tool-page' drive/ec2.php
          grep -q 'css/personal-tools.css' drive/ec2.php
          grep -q 'js/theme-state-bridge.js' drive/ec2.php
          grep -q 'personal-tool-page' drive/src/View/PersonalAwsPageRenderer.php
          grep -q 'css/personal-tools.css' drive/src/View/PersonalAwsPageRenderer.php
          grep -q 'js/theme-state-bridge.js' drive/src/View/PersonalAwsPageRenderer.php
          grep -q 'shared-folder-link .name' drive/bloque_carpetas.php
          grep -q -- '-webkit-text-fill-color: #17324d' drive/bloque_carpetas.php
          grep -q -- '-webkit-text-fill-color: #f2f2f2' drive/bloque_carpetas.php

      - name: Diff check
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
