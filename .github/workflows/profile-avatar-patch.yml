name: Apply profile alias avatar patch

on:
  push:
    branches:
      - fix/user-profile-alias-avatar
    paths:
      - '.github/workflows/profile-avatar-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused presentation patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          presenter = r'''<?php
          declare(strict_types=1);

          namespace ArcadeCloud\Drive\View;

          final class UserIdentityPresenter
          {
              public static function alias(string $identifier): string
              {
                  $local = self::localPart($identifier);
                  return '@' . ($local !== '' ? $local : 'usuario');
              }

              public static function initials(string $identifier): string
              {
                  $local = self::localPart($identifier);
                  if ($local === '') {
                      return 'U';
                  }

                  $normalized = preg_replace('/[._\-]+/u', ' ', $local) ?? $local;
                  $parts = preg_split('/\s+/u', trim($normalized), -1, PREG_SPLIT_NO_EMPTY) ?: [];

                  if (count($parts) >= 2) {
                      return self::upper(self::first($parts[0]) . self::first($parts[count($parts) - 1]));
                  }

                  return self::upper(self::first($local));
              }

              private static function localPart(string $identifier): string
              {
                  $value = trim($identifier);
                  if ($value === '') {
                      return '';
                  }

                  if (str_starts_with($value, '@')) {
                      $value = ltrim($value, '@');
                  }

                  $at = strpos($value, '@');
                  if ($at !== false) {
                      $value = substr($value, 0, $at);
                  }

                  return trim($value);
              }

              private static function first(string $value): string
              {
                  if ($value === '') {
                      return '';
                  }

                  return function_exists('mb_substr')
                      ? (string) mb_substr($value, 0, 1, 'UTF-8')
                      : substr($value, 0, 1);
              }

              private static function upper(string $value): string
              {
                  return function_exists('mb_strtoupper')
                      ? (string) mb_strtoupper($value, 'UTF-8')
                      : strtoupper($value);
              }
          }
          '''
          # Remove indentation introduced by YAML heredoc formatting.
          presenter = '\n'.join(line[10:] if line.startswith('          ') else line for line in presenter.splitlines()) + '\n'
          Path('drive/src/View/UserIdentityPresenter.php').write_text(presenter)

          test = r'''<?php
          declare(strict_types=1);

          require_once __DIR__ . '/../src/View/UserIdentityPresenter.php';

          use ArcadeCloud\Drive\View\UserIdentityPresenter;

          $cases = [
              [UserIdentityPresenter::alias('jimmybackend@example.com'), '@jimmybackend'],
              [UserIdentityPresenter::initials('jimmybackend@example.com'), 'J'],
              [UserIdentityPresenter::initials('jimmy.backend@example.com'), 'JB'],
              [UserIdentityPresenter::initials('Jimmy Backend'), 'JB'],
              [UserIdentityPresenter::alias('soporte@example.com'), '@soporte'],
              [UserIdentityPresenter::initials('Soporte'), 'S'],
          ];

          foreach ($cases as [$actual, $expected]) {
              if ($actual !== $expected) {
                  fwrite(STDERR, "Expected {$expected}, got {$actual}\n");
                  exit(1);
              }
          }

          if (str_contains(UserIdentityPresenter::alias('jimmybackend@example.com'), 'example.com')) {
              fwrite(STDERR, "Alias must never expose the email domain.\n");
              exit(1);
          }

          echo "user identity presenter smoke: OK\n";
          '''
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n'
          Path('drive/tests/user_identity_presenter_smoke.php').write_text(test)

          replace_once(
              'drive/s3.php',
              "$canViewRealAws = $app->personalToolAccessService()->state() === 'owner';\n",
              "$canViewRealAws = $app->personalToolAccessService()->state() === 'owner';\n$userIdentifier = $session->userName();\n$userAlias = \\ArcadeCloud\\Drive\\View\\UserIdentityPresenter::alias($userIdentifier);\n$userInitials = \\ArcadeCloud\\Drive\\View\\UserIdentityPresenter::initials($userIdentifier);\n"
          )

          replace_once(
              'drive/s3.php',
              '''          <img src="logo1.png" alt="Perfil" class="rounded-circle mr-2" width="30" height="30">\n          <span class="drive-user-label"><?= htmlspecialchars($_SESSION['usuario']) ?></span>''',
              '''          <span class="drive-user-avatar rounded-circle mr-2 d-inline-flex align-items-center justify-content-center"\n                aria-hidden="true"\n                style="width:30px;height:30px;min-width:30px;font-size:.75rem;font-weight:700;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.15);letter-spacing:.02em;">\n            <?= htmlspecialchars($userInitials, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>\n          </span>\n          <span class="drive-user-label"><?= htmlspecialchars($userAlias, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?></span>'''
          )

          replace_once(
              'drive/up.php',
              "        <?= htmlspecialchars((string)$user['email']) ?>",
              "        <?= htmlspecialchars(\\ArcadeCloud\\Drive\\View\\UserIdentityPresenter::alias((string)$user['email']), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"
          )

          replace_once(
              'drive/up.php',
              "        <?= htmlspecialchars((string)$targetUser['email']) ?>",
              "        <?= htmlspecialchars(\\ArcadeCloud\\Drive\\View\\UserIdentityPresenter::alias((string)$targetUser['email']), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"
          )

          replace_once(
              'drive/css/responsive.css',
              '''  #usuarioMenu img {\n    width: 28px !important;\n    height: 28px !important;\n\n    flex: 0 0 28px;\n  }''',
              '''  #usuarioMenu img,\n  #usuarioMenu .drive-user-avatar {\n    width: 28px !important;\n    height: 28px !important;\n    min-width: 28px !important;\n\n    flex: 0 0 28px;\n  }'''
          )
          PY

      - name: Validate syntax and behavior
        shell: bash
        run: |
          set -euo pipefail
          php -l drive/s3.php
          php -l drive/up.php
          php -l drive/src/View/UserIdentityPresenter.php
          php -l drive/tests/user_identity_presenter_smoke.php
          php drive/tests/user_identity_presenter_smoke.php
          git diff --check
          ! grep -Fq '<img src="logo1.png" alt="Perfil"' drive/s3.php
          ! grep -Fq "htmlspecialchars((string)\$user['email'])" drive/up.php
          grep -Fq 'UserIdentityPresenter::alias' drive/s3.php
          grep -Fq 'drive-user-avatar' drive/s3.php

      - name: Commit focused patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/profile-avatar-patch.yml
          git add drive/s3.php drive/up.php drive/css/responsive.css drive/src/View/UserIdentityPresenter.php drive/tests/user_identity_presenter_smoke.php
          git commit -m "fix: use private user alias and initials avatar"
          git push origin HEAD
