name: Provision Drive user root

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/provision_user_root.py'
      - '.github/workflows/provision-user-root.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply provisioning migration
        run: python3 .github/scripts/provision_user_root.py
      - name: Validate PHP
        run: |
          php -l drive/src/Storage/UserStorageProvisioner.php
          php -l drive/src/Core/DriveApplication.php
          php -l drive/s3.php
      - name: Audit multiuser root contract
        run: |
          grep -Fq "userStorageProvisioner()->ensureRoot" drive/s3.php
          grep -Fq "return 'Data' . \$userId . '/';" drive/src/Storage/UserStoragePath.php
          grep -Fq "ON DUPLICATE KEY UPDATE" drive/src/Storage/UserStorageProvisioner.php
          grep -Fq "user_id_ = ? AND Prefix = ?" drive/src/Storage/UserStorageProvisioner.php
      - name: Commit migration
        run: |
          git config user.name 'Jimmy Backend'
          git config user.email 'jimmybackend@gmail.com'
          git add drive/src/Storage/UserStorageProvisioner.php drive/src/Core/DriveApplication.php drive/s3.php drive/ARCHITECTURE.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Provision per-user Drive roots on first entry'
            git push
          fi
