name: Remote workstation phase 1

on:
  pull_request:
    paths:
      - 'drive/docker/workstation/**'
      - 'drive/bin/install_workstation_node.sh'
      - 'drive/bin/install_workstation_internal_gateway.sh'
      - 'drive/bin/install_office_gateway.sh'
      - 'drive/bin/uninstall_workstation_node.sh'
      - 'drive/bin/workstation_health.php'
      - 'drive/office-launch.php'
      - 'drive/office-gateway.php'
      - 'drive/workstation-control.php'
      - 'drive/workstation-document.php'
      - 'drive/js/so.js'
      - 'drive/src/Office/**'
      - 'drive/src/Admin/PrivilegedServerHelper.php'
      - 'drive/bin/arcadecloud-drive-admin-helper.php'
      - 'drive/so.php'
      - 'drive/tests/workstation_phase1_contract_smoke.php'
      - 'drive/tests/office_gateway_contract_smoke.php'
      - 'drive/docs/ARCADECLOUD_REMOTE_WORKSTATION.md'
      - '.github/workflows/remote-workstation.yml'
  push:
    branches:
      - feat/remote-workstation-phase1
    paths:
      - 'drive/docker/workstation/**'
      - 'drive/bin/install_workstation_node.sh'
      - 'drive/bin/install_workstation_internal_gateway.sh'
      - 'drive/bin/install_office_gateway.sh'
      - 'drive/bin/uninstall_workstation_node.sh'
      - 'drive/bin/workstation_health.php'
      - 'drive/office-launch.php'
      - 'drive/office-gateway.php'
      - 'drive/workstation-control.php'
      - 'drive/workstation-document.php'
      - 'drive/js/so.js'
      - 'drive/src/Office/**'
      - 'drive/src/Admin/PrivilegedServerHelper.php'
      - 'drive/bin/arcadecloud-drive-admin-helper.php'
      - 'drive/so.php'
      - 'drive/tests/workstation_phase1_contract_smoke.php'
      - 'drive/tests/office_gateway_contract_smoke.php'
      - '.github/workflows/remote-workstation.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n drive/docker/workstation/entrypoint.sh
          bash -n drive/bin/install_workstation_node.sh
          bash -n drive/bin/install_workstation_internal_gateway.sh
          bash -n drive/bin/install_office_gateway.sh
          bash -n drive/bin/uninstall_workstation_node.sh
      - name: PHP syntax
        run: |
          php -l drive/bin/workstation_health.php
          php -l drive/office-launch.php
          php -l drive/office-gateway.php
          php -l drive/workstation-control.php
          php -l drive/workstation-document.php
          php -l drive/src/Http/Controller/OfficeDocumentController.php
          php -l drive/src/Office/OfficeLaunchTokenRepository.php
          php -l drive/src/Office/OfficeGatewayService.php
          php -l drive/src/Office/OfficeDocumentSessionRepository.php
          php -l drive/src/Office/OfficeDocumentStorageService.php
          php -l drive/src/Office/OfficeSchemaMigrationService.php
          php -l drive/src/Office/OfficeSessionLeaseRepository.php
          php -l drive/src/Office/OfficeWorkstationClient.php
          php -l drive/src/Admin/PrivilegedServerHelper.php
          php -l drive/bin/arcadecloud-drive-admin-helper.php
          php -l drive/tests/workstation_phase1_contract_smoke.php
          php -l drive/tests/office_gateway_contract_smoke.php
      - name: JavaScript syntax
        run: node --check drive/js/so.js
      - name: Workstation contract
        run: php drive/tests/workstation_phase1_contract_smoke.php
      - name: Office gateway contract
        run: php drive/tests/office_gateway_contract_smoke.php
      - name: Build workstation image
        run: docker build -t arcadecloud/workstation:ci drive/docker/workstation
