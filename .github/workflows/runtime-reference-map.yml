name: Runtime endpoint map

on:
  push:
    branches: [main]
    paths:
      - 'drive/**/*.php'
      - 'drive/**/*.js'
      - '.github/scripts/runtime_reference_map.py'
      - '.github/workflows/runtime-reference-map.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: drive-generated-docs-main
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/runtime_reference_map.py
      - name: Propose updated runtime endpoint map
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/runtime-endpoint-map
          base: main
          add-paths: |
            drive/docs/RUNTIME_ENDPOINTS.md
            drive/docs/runtime_endpoints.json
          commit-message: "docs: refresh runtime endpoint map"
          title: "docs: refresh runtime endpoint map"
          body: |
            Automatically regenerated by the Runtime endpoint map workflow.
            Only the generated endpoint report and JSON map are included.

            Review the generated changes and required checks before merging to main.
