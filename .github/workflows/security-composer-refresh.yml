name: Security Composer Refresh

on:
  push:
    branches:
      - security/oop-hardening-2026-09-18
    paths:
      - composer.json
      - .github/workflows/security-composer-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/oop-hardening-2026-09-18
          fetch-depth: 0

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Resolve secure dependency set
        run: |
          composer update aws/aws-sdk-php spomky-labs/otphp --with-all-dependencies --no-interaction --prefer-dist
          composer validate --no-check-publish
          composer audit --locked --no-interaction

      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock already current"
            exit 0
          fi
          git commit -m "security: refresh Composer lock"
          git pull --rebase origin security/oop-hardening-2026-09-18
          git push origin HEAD:security/oop-hardening-2026-09-18
