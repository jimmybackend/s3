name: Security hardening

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - security/oop-hardening-2026-09-18

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: curl, mysqli
          coverage: none

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Dependency audit
        run: |
          composer validate --no-check-publish
          composer audit --locked --no-interaction

      - name: PHP syntax
        run: find drive -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: |
          for file in drive/js/*.js; do
            node --check "$file"
          done

      - name: Runtime OOP inventory
        run: |
          python3 .github/scripts/oop_inventory.py | tee /tmp/oop-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('drive/docs/oop_inventory.json').read_text())
          summary = data['summary']
          print('OOP runtime summary:', json.dumps(summary, ensure_ascii=False))
          bad_src = [
              row['path'] for row in data['php']
              if 'src file without class' in row.get('issues', [])
          ]
          php_debt = [
              (row['path'], row['kind'], row.get('issues', []))
              for row in data['php']
              if (
                  row['kind'] in {'procedural endpoint', 'endpoint with logic', 'cli entrypoint with logic'}
                  or (row.get('functions') and row['kind'] != 'test script')
                  or any(
                      issue.startswith(('DB in entrypoint', 'AWS/S3 in entrypoint'))
                      for issue in row.get('issues', [])
                  )
              )
          ]
          js_debt = [
              row['path'] for row in data['js']
              if not row.get('classes') or row.get('functions')
          ]
          print('PHP runtime OOP debt:', json.dumps(php_debt, ensure_ascii=False))
          print('JS runtime OOP debt:', json.dumps(js_debt, ensure_ascii=False))
          if bad_src:
              raise SystemExit('src/ sin clase: ' + ', '.join(bad_src))
          if php_debt:
              raise SystemExit('PHP runtime fuera del criterio OOP: ' + ', '.join(row[0] for row in php_debt))
          if js_debt:
              raise SystemExit('JavaScript sin clase/encapsulación OOP: ' + ', '.join(js_debt))
          PY

      - name: Security regression tests
        run: |
          php drive/tests/security_hardening_smoke.php
          php drive/tests/federation_https_contract_smoke.php
          php drive/tests/setup_bootstrap_smoke.php

      - name: Security contract checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "ini_set('display_errors', '1')" drive/s3.php
          grep -q "HTTP_X_DRIVE_CSRF" drive/src/Http/Controller/UploadController.php
          grep -q "method() !== 'POST'" drive/src/Http/Controller/UploadController.php
          grep -q "DRIVE_UPLOAD_CSRF" drive/s3.php
          grep -q "FILTER_FLAG_NO_PRIV_RANGE" drive/upload/drivers/RemoteUrlUploader.php
          grep -q "169.254.169.254" drive/upload/drivers/RemoteUrlUploader.php
          grep -q "CURLOPT_FOLLOWLOCATION => false" drive/upload/drivers/RemoteUrlUploader.php
          grep -q "CURLOPT_RESOLVE" drive/upload/drivers/RemoteUrlUploader.php
          grep -q "MAX_BYTES" drive/upload/drivers/RemoteUrlUploader.php
          grep -q "admin_upload_csrf" drive/up.php

          # Standalone privileged helpers must remain allowlisted and shell-safe.
          grep -q "final class ArcadeCloudDriveAdminHelper" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "requireServerOperator" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "token_hash" drive/bin/arcadecloud-drive-admin-helper.php
          grep -q "password_hash('arcadecloud'" drive/bin/arcadecloud-drive-admin-helper.php
          ! grep -Eq '\\b(shell_exec|exec|system|passthru|popen)\\s*\\(' drive/bin/arcadecloud-drive-admin-helper.php

          grep -q "final class ArcadeCloudDriveUpdater" drive/bin/arcadecloud-drive-updater.php
          grep -q "merge.*--ff-only" drive/bin/arcadecloud-drive-updater.php
          grep -q "jimmybackend/s3" drive/bin/arcadecloud-drive-updater.php
          grep -q "bypass_shell" drive/bin/arcadecloud-drive-updater.php

          grep -q "final class FederationHttpsReconciler" drive/bin/federation_https_reconcile.php
          ! grep -Eq '\\b(shell_exec|exec|system|passthru|popen)\\s*\\(' drive/bin/federation_https_reconcile.php

          for file in drive/js/subir.js drive/js/subir-dropzone.js drive/js/subir-chunked.js drive/js/soportesMediaTypes.js; do
            grep -q "X-Drive-CSRF" "$file"
          done

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- .             ':!composer.lock' ':!drive/docs/**' ':!drive/tests/**'; then
            echo "Potential committed secret detected."
            exit 1
          fi
