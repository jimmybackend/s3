name: Shared transcript reader
on:
  pull_request:
    paths: ['drive/src/View/**', 'drive/src/Book/**', 'drive/src/Activity/ActivityCostRecorder.php', 'drive/js/book-ai-formatter.js', 'drive/tests/book_ai_layout.php', 'drive/src/Http/Controller/PublicShareController.php', 'drive/js/share-reader.js', 'drive/css/share-reader.css', 'drive/tests/shared_transcript_reader.php', 'drive/tests/shared_book_browser.cjs', '.github/workflows/shared-transcript-reader.yml']
  push:
    branches: [main]
    paths: ['drive/src/View/**', 'drive/src/Book/**', 'drive/src/Activity/ActivityCostRecorder.php', 'drive/js/book-ai-formatter.js', 'drive/tests/book_ai_layout.php', 'drive/src/Http/Controller/PublicShareController.php', 'drive/js/share-reader.js', 'drive/css/share-reader.css', 'drive/tests/shared_transcript_reader.php', 'drive/tests/shared_book_browser.cjs', '.github/workflows/shared-transcript-reader.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: |
          find drive/src/Book -name '*.php' -exec php -l {} \;
          php -l drive/src/Activity/ActivityCostRecorder.php
          php drive/tests/book_ai_layout.php
          php -l drive/src/View/ExtractedTextReader.php
          php -l drive/src/View/TranscriptReader.php
          php -l drive/src/View/SharePageRenderer.php
          php -l drive/src/Http/Controller/PublicShareController.php
          php drive/tests/shared_transcript_reader.php
          node --check drive/js/share-reader.js
          node --check drive/js/book-ai-formatter.js
      - name: Verify book navigation in browser
        run: |
          npm install --prefix "$RUNNER_TEMP/reader-browser" playwright
          "$RUNNER_TEMP/reader-browser/node_modules/.bin/playwright" install --with-deps chromium
          READER_PLAYWRIGHT="$RUNNER_TEMP/reader-browser/node_modules/playwright" node drive/tests/shared_book_browser.cjs
