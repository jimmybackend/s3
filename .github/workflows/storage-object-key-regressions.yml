name: Storage object key regressions

on:
  pull_request:
    branches: [main]
    paths:
      - 'drive/src/Storage/StorageObjectNameCodec.php'
      - 'drive/src/Storage/S3ObjectCopyService.php'
      - 'drive/src/Application/FileMutationService.php'
      - 'drive/src/Application/FolderMutationService.php'
      - 'drive/src/Upload/**'
      - 'drive/upload/drivers/**'
      - 'drive/src/Aws/FolderTextractService.php'
      - 'drive/src/Application/FileKeyRotationService.php'
      - 'drive/src/Office/OfficeDocumentStorageService.php'
      - 'drive/tests/storage_object_name_codec_regression.php'
      - '.github/workflows/storage-object-key-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'drive/src/Storage/StorageObjectNameCodec.php'
      - 'drive/tests/storage_object_name_codec_regression.php'
      - '.github/workflows/storage-object-key-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-keys:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: PHP syntax and storage-key regression
        run: |
          set -euo pipefail
          php -l drive/src/Storage/StorageObjectNameCodec.php
          php -l drive/src/Storage/S3ObjectCopyService.php
          php -l drive/src/Application/FolderMutationService.php
          php -l drive/src/Application/FileMutationService.php
          php -l drive/tests/storage_object_name_codec_regression.php
          php drive/tests/storage_object_name_codec_regression.php
