name: Sync MiChat schema once

on:
  push:
    branches:
      - feature/about-metadata-direct-upload
    paths:
      - .github/workflows/sync-michat-schema-once.yml

permissions:
  contents: write

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/about-metadata-direct-upload
          fetch-depth: 0

      - name: Fetch canonical MiChat schema
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/jimmybackend/michat/main/adbbmis1_Cloud.sql \
            --output /tmp/adbbmis1_Cloud.sql

          grep -q 'CREATE TABLE IF NOT EXISTS `FileS3`' /tmp/adbbmis1_Cloud.sql
          grep -q '`Metadatos` mediumtext' /tmp/adbbmis1_Cloud.sql
          grep -q 'CREATE TABLE IF NOT EXISTS `UserAIAgentConfigs`' /tmp/adbbmis1_Cloud.sql

          cp /tmp/adbbmis1_Cloud.sql adbbmis1_Cloud.sql

      - name: Commit synchronized schema and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/sync-michat-schema-once.yml
          git add adbbmis1_Cloud.sql

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m 'Sync shared MySQL schema from MiChat'
          git push origin HEAD:feature/about-metadata-direct-upload
