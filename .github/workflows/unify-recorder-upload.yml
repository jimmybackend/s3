name: Unify recorder upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-recorder-upload.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply recorder change
        run: python3 .github/scripts/unify_recorder_upload.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check drive/js/soportesMediaTypes.js
          test ! -e drive/firma_grabadora.php
          ! grep -q 'firma_grabadora.php' drive/js/soportesMediaTypes.js
          grep -q 'DriveUploadDestination.capture' drive/js/soportesMediaTypes.js
          grep -q 'mode=local_put&action=complete' drive/js/soportesMediaTypes.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/unify_recorder_upload.py
          git rm .github/workflows/unify-recorder-upload.yml
          git add -A
          git commit -m 'Route recorder uploads through immutable Drive upload flow'
          git push origin main
