name: Validate AI search metadata fix

on:
  push:
    branches: [fix/ai-search-metadata-persistence]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          php -l drive/src/Aws/FileMetadataRepository.php
          php -l drive/src/Aws/ComprehendFileService.php
          php -l drive/src/Aws/RekognitionFileService.php
          php -l drive/src/Aws/TextractFileService.php
          php -l drive/src/Http/Controller/AwsFileController.php
      - name: Validate JavaScript syntax
        run: node --check drive/js/ai-search.js
      - name: Validate navigation and persistence invariants
        run: |
          grep -q 'class="btn btn-sm btn-outline-primary btn-ir"' drive/js/ai-search.js
          ! grep -q "window.location.href" drive/js/ai-search.js
          grep -q 'SELECT Metadatos FROM FileS3' drive/src/Aws/FileMetadataRepository.php
          grep -q 'UPDATE FileS3 SET Metadatos' drive/src/Aws/FileMetadataRepository.php
          grep -q 'MySQL no confirmó la persistencia' drive/src/Aws/FileMetadataRepository.php
          grep -q "'Rekognition'" drive/src/Aws/RekognitionFileService.php
          grep -q "'Textract'" drive/src/Aws/TextractFileService.php
          grep -q "'Comprehend'" drive/src/Aws/ComprehendFileService.php
          ! grep -q 'putObject' drive/src/Aws/RekognitionFileService.php
          ! grep -q 'putObject' drive/src/Aws/TextractFileService.php
          ! grep -q 'putObject' drive/src/Aws/ComprehendFileService.php
