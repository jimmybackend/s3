name: Version AWS JS by filemtime

on:
  push:
    branches: ['refactor/oop-drive-migration']
    paths:
      - '.github/workflows/version-aws-js-filemtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch s3.php
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('drive/s3.php')
          s = p.read_text()
          old1 = '<script src="js/polly.js?v=20260905-aws-actions1"></script>'
          new1 = '<script src="js/polly.js?v=<?= (int) filemtime(__DIR__ . \'/js/polly.js\') ?>"></script>'
          old2 = '<script src="js/aws-comprehend.js?v=20260905-aws-actions1"></script>'
          new2 = '<script src="js/aws-comprehend.js?v=<?= (int) filemtime(__DIR__ . \'/js/aws-comprehend.js\') ?>"></script>'
          if old1 not in s:
              raise SystemExit('POLLY_TAG_NOT_FOUND')
          if old2 not in s:
              raise SystemExit('COMPREHEND_TAG_NOT_FOUND')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY

      - name: Validate
        run: |
          php -l drive/s3.php
          grep -F "filemtime(__DIR__ . '/js/polly.js')" drive/s3.php
          grep -F "filemtime(__DIR__ . '/js/aws-comprehend.js')" drive/s3.php
          git diff --check

      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'NO_CHANGE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drive/s3.php
          git commit -m 'Version AWS scripts from file modification time'
          git push origin HEAD:refactor/oop-drive-migration
