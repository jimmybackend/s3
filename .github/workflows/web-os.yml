permissions:
  contents: read

jobs:
  web-os-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l drive/so.php
          php -l drive/notebook.php
          php -l drive/notebook-api.php
          php -l drive/src/Notebook/NotebookService.php
          php -l drive/tests/notebook_contract_smoke.php
          php -l drive/src/System/NodeCapabilityService.php
          php -l drive/federationcloud/os-admin.php
          php -l drive/src/Http/Controller/FederationOsAdminController.php
          php -l drive/src/View/FederationOsAdminRenderer.php
          php -l drive/src/Http/Controller/FederationPortalController.php
          php -l drive/src/View/FederationPortalRenderer.php
          php -l drive/src/Application/FileMutationService.php
          php -l drive/src/Application/FolderMutationService.php
          php -l drive/src/Application/MoveJobService.php
          php -l drive/src/Application/FileSearchService.php
          php -l drive/src/Application/AiFileSearchService.php
          php -l drive/src/Application/FileListService.php
          php -l drive/src/Http/Controller/FileSearchController.php
          php -l drive/buscar_archivo.php
          php -l drive/src/Storage/FileRecordRepository.php
          php -l drive/src/Storage/FolderMutationRepository.php
          php -l drive/src/Http/Controller/MoveJobController.php
          php -l drive/src/Http/Controller/NodeStatusController.php
          php -l drive/node-status.php
          php -l drive/src/Admin/ServerMaintenanceJobStore.php
          php -l drive/src/Admin/ServerMaintenanceService.php
          php -l drive/src/Admin/ServerTaskActivityProbe.php
          php -l drive/src/Console/ServerMaintenanceWorkerCommand.php
          php -l drive/bin/server_maintenance_worker.php
          php -l drive/src/Application/BackgroundWorkerLauncher.php
          php -l drive/src/Sync/SyncJobStore.php
          php -l drive/src/Storage/MoveJobStore.php
          php -l drive/src/Http/Controller/BackgroundTaskController.php
          php -l drive/src/Http/Controller/MediaProcessingController.php
          php -l drive/src/Http/Controller/AuthController.php
          php -l drive/src/Media/MediaWorkerNodeService.php
          php -l drive/src/Console/MoveJobWorkerCommand.php
          php -l drive/tests/web_os_contract_smoke.php
          php -l drive/tests/web_os_clipboard_contract_smoke.php
      - name: JavaScript syntax
        run: |
          node --check drive/js/so.js
          node --check drive/js/notebook.js
          node --check drive/js/file-security.js
          node --check drive/js/so-search.js
          node --check drive/js/archivos.js
          node --check drive/js/so-node.js
          node --check drive/js/so-share.js
          node --check drive/js/arcadelink-share.js
          node --check drive/js/so-clipboard.js
          node --check drive/js/upload-center.js
          node --check drive/js/upload-destination.js
          node --check drive/js/background-tasks.js
          node --check drive/js/compute-node-idle.js
          node --check drive/js/arcadecloud-updater.js
          node --check drive/js/so-screenshot-paste.js
          node --check drive/js/so-terminal.js
          node --check drive/js/so-federation.js
          node --check drive/js/federation-os-admin.js
          node --check drive/js/federation-portal.js
          node --check drive/js/so-folders.js
          node --check drive/js/carpetas.js
          node --check drive/js/folder-document.js
          node --check drive/js/sincronizar.js
          node --check drive/js/move-tasks.js
      - name: Web OS contract
        run: |
          php drive/tests/web_os_contract_smoke.php
          php drive/tests/notebook_contract_smoke.php
          php drive/tests/web_os_pending_fixes_smoke.php
          php drive/tests/web_os_multiwindow_smoke.php
          php drive/tests/web_os_clipboard_contract_smoke.php
      - name: Search location behavior
        run: |
          node drive/tests/background_tasks_refresh_functional.js
          node drive/tests/web_os_search_location_functional.js
          node drive/tests/web_os_folder_rename_functional.js

  embedded-panels-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix /tmp/arcade-browser-tests --no-audit --no-fund playwright@1.51.1
          node /tmp/arcade-browser-tests/node_modules/playwright/cli.js install --with-deps chromium
      - name: Embedded Federation, moderation, EC2 and RDS behavior
        env:
          PLAYWRIGHT_MODULE: /tmp/arcade-browser-tests/node_modules/playwright
        run: node drive/tests/system_panels_browser.cjs
