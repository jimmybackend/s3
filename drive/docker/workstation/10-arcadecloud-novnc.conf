# ArcadeCloud Office: KDE/noVNC audio does not depend on XRDP/Guacamole.
# Loaded by pipewire-pulse at startup on the ephemeral Docker image.
# This creates the monitor even if no audio device or RDP client exists.
pulse.cmd = [
    { cmd = "load-module"
      args = "module-null-sink sink_name=arcadecloud-web rate=44100 channels=2"
      flags = [ nofail ] }
]
