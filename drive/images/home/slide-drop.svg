  <g transform="translate(545 310)"><rect width="220" height="275" rx="30" fill="#111c32" stroke="#d067ff" stroke-width="4"/><circle cx="110" cy="108" r="58" fill="#6b2d8e"/><text x="110" y="120" text-anchor="middle" fill="#fff" font-size="44">$</text><text x="110" y="215" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Pago</text></g>
  <g transform="translate(970 310)"><rect width="220" height="275" rx="30" fill="#111c32" stroke="#48ffc0" stroke-width="4"/><path d="M55 135c0-45 32-72 70-72 26 0 47 14 58 35 32 2 57 28 57 61 0 34-28 61-62 61H78c-40 0-73-32-73-72 0-31 20-58 50-68z" fill="#1e8f70"/><path d="M110 175V105M82 133l28-28 28 28" stroke="#fff" stroke-width="10" fill="none"/><text x="110" y="235" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">S3 privado</text></g>
  <g transform="translate(1380 310)"><rect width="150" height="275" rx="30" fill="#111c32" stroke="#5f8cff" stroke-width="4"/><circle cx="75" cy="100" r="44" fill="#245c9d"/><path d="M48 100h54M75 73v54" stroke="#fff" stroke-width="8"/><text x="75" y="205" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Enlace</text><text x="75" y="237" text-anchor="middle" fill="#9fb7c8" font-size="18">temporal</text></g>
