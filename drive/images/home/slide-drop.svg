  <g transform="translate(650 675)"><rect width="300" height="90" rx="22" fill="#0d2032" stroke="#37dca7"/><text x="150" y="38" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Límite de descargas</text><text x="150" y="66" text-anchor="middle" fill="#9fb7c8" font-size="18">Controlado por la orden</text></g>
  <g transform="translate(980 675)"><rect width="300" height="90" rx="22" fill="#0d2032" stroke="#37dca7"/><text x="150" y="38" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Custodia central</text><text x="150" y="66" text-anchor="middle" fill="#9fb7c8" font-size="18">drive.esforzados.com</text></g>
