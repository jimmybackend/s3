<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">FederationDrop para transferencias temporales</title>
<desc id="desc">Flujo visual de archivo, pago, subida privada, custodia temporal y enlace de descarga.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120d28"/><stop offset=".55" stop-color="#07111f"/><stop offset="1" stop-color="#08241f"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="85" y="105" fill="#f7fbff" font-family="Arial,sans-serif" font-size="60" font-weight="700">FederationDrop</text>
<text x="88" y="160" fill="#aabfd0" font-family="Arial,sans-serif" font-size="27">Sube · paga · comparte por tiempo y descargas</text>

<g stroke="#8e6cff" stroke-width="6" fill="none" opacity=".88">
  <path d="M330 450H540"/><path d="M745 450H950"/><path d="M1155 450H1370"/>
</g>
<g fill="#8e6cff"><polygon points="530,438 555,450 530,462"/><polygon points="940,438 965,450 940,462"/><polygon points="1360,438 1385,450 1360,462"/></g>

